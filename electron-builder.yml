appId: com.mideum.llpresenter
productName: LoveLight Presenter
executableName: LoveLightPresenter
directories:
  output: artifacts/installer
  buildResources: build
files:
  - out/**/*
  - package.json
  - build/icon.ico
  - '!**/*.{llbible,gguf,log}'
  - '!**/{.llp,test,tests,coverage,userData,logs}/**/*'
extraResources:
  - from: design/system/project/fonts/LICENSE.txt
    to: notices/Pretendard-OFL.txt
  - from: src/renderer/src/ui/icons/LICENSE-phosphor.txt
    to: notices/Phosphor-MIT.txt
  - from: node_modules/koffi/LICENSE.txt
    to: notices/Koffi-MIT.txt
asar: true
asarUnpack:
  - '**/node_modules/koffi/**'
  - '**/node_modules/@koromix/**'
npmRebuild: false
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LoveLight Presenter
  uninstallDisplayName: LoveLight Presenter
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  artifactName: LoveLightPresenter-Setup-${version}.${ext}
publish:
  provider: github
  owner: 0913vision
  repo: llpresenter
  private: false
  releaseType: draft
  vPrefixedTagName: true
