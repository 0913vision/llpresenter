name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      major:
        description: Raise the major version (only with the user's permission)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@v6.1.0
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - run: npm ci

      - run: npm run verify

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  bump:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.20.0

      - name: Commit and tag the next version
        env:
          MAJOR: ${{ inputs.major }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$MAJOR" = 'true' ]; then
            node scripts/version/run.mts --major
          else
            node scripts/version/run.mts
          fi

      - name: Push the bump commit and its tag
        run: git push --atomic --follow-tags origin HEAD:refs/heads/main
