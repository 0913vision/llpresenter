name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      major:
        description: Raise the major version (only with the user's permission)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NOTE(0913vision): The October 25 user decision moves branch verification to
# GitHub runners. Main keeps its local pre-push check and only bumps here.
jobs:
  checks:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.20.0
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v6.1.0
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - run: npm ci
      - name: Cache Prettier results
        uses: actions/cache@v6.1.0
        with:
          path: node_modules/.cache/prettier
          key: prettier-${{ runner.os }}-${{ hashFiles('package-lock.json', '.prettierrc.json', '.prettierignore') }}-${{ github.sha }}
          restore-keys: prettier-${{ runner.os }}-${{ hashFiles('package-lock.json', '.prettierrc.json', '.prettierignore') }}-
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  tests:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.20.0
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v6.1.0
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - run: npm ci
      - run: npx --no-install vitest run --coverage --coverage.reporter=text-summary --reporter=blob --shard=${{ matrix.shard }}/3
        env:
          LLP_CI_TEST_WORKERS: '1'
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.20.0
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v6.1.0
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - run: npm ci
      - name: Download shard results
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: vitest-blob-*
          path: .vitest/blob
          merge-multiple: true
      - run: npx --no-install vitest run --merge-reports --coverage
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.20.0

      - name: Commit and tag the next version
        env:
          MAJOR: ${{ inputs.major }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$MAJOR" = 'true' ]; then
            node scripts/version/run.mts --major
          else
            node scripts/version/run.mts
          fi

      - name: Push the bump commit and its tag
        run: git push --atomic --follow-tags origin HEAD:refs/heads/main
