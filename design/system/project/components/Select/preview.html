<!-- @dsCard group="입력" height=500 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Select</title>
</head>
<body>
<div class="ll-preview">

  <div class="ll-spec-title">크기</div>
  <div class="ll-on-panel">
    <div class="ll-spec">
      <div class="ll-spec-item">
        <button type="button" class="ll-select ll-select--sm" aria-haspopup="listbox" aria-expanded="false"><span class="ll-select__value">주일용</span><span class="ll-i ll-i-down ll-select__chevron"></span></button>
        <span class="ll-spec-label">sm 26, 12px, 패널 머리글</span>
      </div>
      <div class="ll-spec-item">
        <button type="button" class="ll-select" aria-haspopup="listbox" aria-expanded="false" style="width: 240px"><span class="ll-select__value">한국어</span><span class="ll-i ll-i-down ll-select__chevron"></span></button>
        <span class="ll-spec-label">md 30, 13px, 환경설정, 속성 칸</span>
      </div>
      <div class="ll-spec-item">
        <button type="button" class="ll-select" aria-haspopup="listbox" aria-expanded="false" style="width: 300px"><span class="ll-select__value">모니터 2</span><span class="ll-select__meta">EPSON 프로젝터</span><span class="ll-i ll-i-down ll-select__chevron"></span></button>
        <span class="ll-spec-label">md, 오른쪽 부가 정보 text-2</span>
      </div>
    </div>
  </div>

  <div class="ll-spec-title">앞 그림과 앞 아이콘</div>
  <div class="ll-on-panel">
    <div class="ll-spec">
      <div class="ll-spec-item">
        <button type="button" class="ll-select ll-select--sm" aria-haspopup="listbox" aria-expanded="false" aria-label="기본 배경 따뜻한 빛"><img class="ll-select__media" src="/_blob/a52f8166b3e4175cb8ae640545551821" alt=""><span class="ll-select__value">따뜻한 빛</span><span class="ll-i ll-i-down ll-select__chevron"></span></button>
        <span class="ll-spec-label">sm, 미디어 36×20, 기본 배경</span>
      </div>
      <div class="ll-spec-item">
        <button type="button" class="ll-select ll-select--block" aria-haspopup="listbox" aria-expanded="false" style="width: 300px"><img class="ll-select__media" src="/_blob/a52f8166b3e4175cb8ae640545551821" alt=""><span class="ll-select__value">따뜻한 빛</span><span class="ll-select__meta">곡 기본값</span><span class="ll-i ll-i-down ll-select__chevron"></span></button>
        <span class="ll-spec-label">md, 미디어, 항목 설정의 배경</span>
      </div>
      <div class="ll-spec-item">
        <button type="button" class="ll-select ll-select--block" aria-haspopup="listbox" aria-expanded="false" style="width: 300px"><span class="ll-select__tile ll-select__tile--teal"><span class="ll-i ll-i-song"></span></span><span class="ll-select__value">찬양</span><span class="ll-select__meta">매크로</span><span class="ll-i ll-i-down ll-select__chevron"></span></button>
        <span class="ll-spec-label">md, 매크로 색 칸 20, 시작할 때</span>
      </div>
    </div>
    <div class="ll-spec" style="margin-top: 16px">
      <div class="ll-spec-item">
        <button type="button" class="ll-select" aria-haspopup="dialog" aria-expanded="false"><span class="ll-i ll-i-cal ll-select__icon"></span><span class="ll-select__value ll-num">11월 1일 일요일</span><span class="ll-i ll-i-down ll-select__chevron"></span></button>
        <span class="ll-spec-label">md, 앞 아이콘 16, 날짜</span>
      </div>
      <div class="ll-spec-item">
        <button type="button" class="ll-select" aria-haspopup="listbox" aria-expanded="false"><span class="ll-i ll-i-clock ll-select__icon"></span><span class="ll-select__value ll-num">오전 11:00</span><span class="ll-i ll-i-down ll-select__chevron"></span></button>
        <span class="ll-spec-label">md, 시간</span>
      </div>
      <div class="ll-spec-item">
        <button type="button" class="ll-select ll-select--sm" aria-haspopup="listbox" aria-expanded="false" aria-label="역본 개역한글"><span class="ll-i ll-i-translate ll-select__icon"></span><span class="ll-select__value">개역한글</span><span class="ll-i ll-i-down ll-select__chevron"></span></button>
        <span class="ll-spec-label">sm, 앞 아이콘 14, 역본</span>
      </div>
    </div>
  </div>

  <div class="ll-spec-title">상태</div>
  <div class="ll-on-panel">
    <div class="ll-spec">
      <div class="ll-spec-item">
        <button type="button" class="ll-select" aria-haspopup="listbox" aria-expanded="false" style="width: 150px"><span class="ll-select__value">1분마다</span><span class="ll-i ll-i-down ll-select__chevron"></span></button>
        <span class="ll-spec-label">기본</span>
      </div>
      <div class="ll-spec-item">
        <button type="button" class="ll-select is-hover" aria-haspopup="listbox" aria-expanded="false" style="width: 150px"><span class="ll-select__value">1분마다</span><span class="ll-i ll-i-down ll-select__chevron"></span></button>
        <span class="ll-spec-label">마우스 올림</span>
      </div>
      <div class="ll-spec-item">
        <button type="button" class="ll-select" aria-haspopup="listbox" aria-expanded="true" style="width: 150px"><span class="ll-select__value">1분마다</span><span class="ll-i ll-i-down ll-select__chevron"></span></button>
        <span class="ll-spec-label">열림, 메뉴는 Menu</span>
      </div>
      <div class="ll-spec-item">
        <button type="button" class="ll-select is-focus" aria-haspopup="listbox" aria-expanded="false" style="width: 150px"><span class="ll-select__value">1분마다</span><span class="ll-i ll-i-down ll-select__chevron"></span></button>
        <span class="ll-spec-label">포커스</span>
      </div>
      <div class="ll-spec-item">
        <button type="button" class="ll-select" aria-haspopup="listbox" aria-expanded="false" style="width: 150px" disabled><span class="ll-select__value ll-num">1920×1080</span><span class="ll-i ll-i-down ll-select__chevron"></span></button>
        <span class="ll-spec-label">쓸 수 없음</span>
      </div>
    </div>
  </div>

</div>
</body>
</html>
