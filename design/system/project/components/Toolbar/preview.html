<!-- @dsCard group="앱 틀" height=380 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Toolbar</title>
<style>
.pv-group { display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>
<div class="ll-preview">

<div class="pv-group">
<div class="ll-spec-title">툴바, 56, 안쪽 좌우 4, 사이 6, 구분선 1×24 (테두리는 미리보기용)</div>
<header class="ll-toolbar" style="box-shadow: 0 0 0 1px var(--line)">
<div class="ll-toolbar__group" role="tablist" aria-label="작업 공간">
<button type="button" class="ll-tbtn ll-tbtn--tab" role="tab" aria-selected="true"><span class="ll-i ll-i-slides"></span><span class="ll-tbtn__label">진행</span></button>
<button type="button" class="ll-tbtn ll-tbtn--tab" role="tab" aria-selected="false"><span class="ll-i ll-i-edit"></span><span class="ll-tbtn__label">준비</span></button>
<button type="button" class="ll-tbtn ll-tbtn--tab" role="tab" aria-selected="false"><span class="ll-i ll-i-gear"></span><span class="ll-tbtn__label">화면 설정</span></button>
</div>
<span class="ll-toolbar__divider"></span>
<button type="button" class="ll-tbtn ll-tbtn--toggle" aria-pressed="true" title="미디어 닫기"><span class="ll-i ll-i-film"></span><span class="ll-tbtn__label">미디어</span></button>
<div class="ll-toolbar__center"><label class="ll-field ll-field--ring ll-toolbar__search"><span class="ll-i ll-field__icon ll-i-search"></span><input class="ll-field__input" type="search" aria-label="검색" placeholder="곡, 가사, 초성"></label></div>
<button type="button" class="ll-tbtn ll-tbtn--menu" aria-haspopup="menu" aria-expanded="false" title="Look 고르기"><span class="ll-tbtn__icon"><span class="ll-i ll-i-layers"></span><span class="ll-i ll-tbtn__chevron ll-i-down"></span></span><span class="ll-tbtn__label">평상시</span></button>
<span class="ll-toolbar__divider"></span>
<div class="ll-toolbar__group" role="group" aria-label="화면 출력">
<button type="button" class="ll-tbtn ll-tbtn--output" aria-pressed="true" data-state="live" title="본 화면 출력 끄기 (모니터 2)"><span class="ll-tbtn__icon"><span class="ll-i ll-i-mplay"></span><span class="ll-tbtn__dot"></span></span><span class="ll-tbtn__label">본 화면</span></button>
<button type="button" class="ll-tbtn ll-tbtn--output" aria-pressed="true" data-state="live" title="무대 화면 출력 끄기 (모니터 3)"><span class="ll-tbtn__icon"><span class="ll-i ll-i-mplay"></span><span class="ll-tbtn__dot"></span></span><span class="ll-tbtn__label">무대</span></button>
<button type="button" class="ll-tbtn ll-tbtn--output" aria-pressed="true" data-state="live" title="방송 자막 출력 끄기 (NDI)"><span class="ll-tbtn__icon"><span class="ll-i ll-i-capture"></span><span class="ll-tbtn__dot"></span></span><span class="ll-tbtn__label">방송 자막</span></button>
</div>
</header>
<span class="ll-spec-label">작업 공간 탭 | 미디어, 가운데 검색 칸(md 30, 너비 420, 자리가 모자라면 줄어듦), Look | 화면 출력 셋</span>
</div>

<div class="pv-group">
<header class="ll-toolbar" style="box-shadow: 0 0 0 1px var(--line)">
<div class="ll-toolbar__group" role="tablist" aria-label="작업 공간">
<button type="button" class="ll-tbtn ll-tbtn--tab" role="tab" aria-selected="false"><span class="ll-i ll-i-slides"></span><span class="ll-tbtn__label">진행</span></button>
<button type="button" class="ll-tbtn ll-tbtn--tab" role="tab" aria-selected="true"><span class="ll-i ll-i-edit"></span><span class="ll-tbtn__label">준비</span></button>
<button type="button" class="ll-tbtn ll-tbtn--tab" role="tab" aria-selected="false"><span class="ll-i ll-i-gear"></span><span class="ll-tbtn__label">화면 설정</span></button>
</div>
<span class="ll-toolbar__divider"></span>
<button type="button" class="ll-tbtn ll-tbtn--toggle" aria-pressed="false" title="미디어 열기"><span class="ll-i ll-i-film"></span><span class="ll-tbtn__label">미디어</span></button>
<div class="ll-toolbar__center"><label class="ll-field ll-field--ring ll-toolbar__search is-focus"><span class="ll-i ll-field__icon ll-i-search"></span><input class="ll-field__input" type="search" aria-label="검색" placeholder="곡, 가사, 초성" value="온 세상"></label></div>
<button type="button" class="ll-tbtn ll-tbtn--menu" aria-haspopup="menu" aria-expanded="false" title="Look 고르기"><span class="ll-tbtn__icon"><span class="ll-i ll-i-layers"></span><span class="ll-i ll-tbtn__chevron ll-i-down"></span></span><span class="ll-tbtn__label">평상시</span></button>
<span class="ll-toolbar__divider"></span>
<div class="ll-toolbar__group" role="group" aria-label="화면 출력">
<button type="button" class="ll-tbtn ll-tbtn--output" aria-pressed="true" data-state="live" title="본 화면 출력 끄기 (모니터 2)"><span class="ll-tbtn__icon"><span class="ll-i ll-i-mplay"></span><span class="ll-tbtn__dot"></span></span><span class="ll-tbtn__label">본 화면</span></button>
<button type="button" class="ll-tbtn ll-tbtn--output" aria-pressed="true" data-state="warning" title="무대 화면: 모니터 3을 찾을 수 없습니다"><span class="ll-tbtn__icon"><span class="ll-i ll-i-mplay"></span><span class="ll-tbtn__dot"></span></span><span class="ll-tbtn__label">무대</span></button>
<button type="button" class="ll-tbtn ll-tbtn--output" aria-pressed="false" data-state="off" title="방송 자막 출력 켜기 (NDI)"><span class="ll-tbtn__icon"><span class="ll-i ll-i-capture"></span><span class="ll-tbtn__dot"></span></span><span class="ll-tbtn__label">방송 자막</span></button>
</div>
</header>
<span class="ll-spec-label">준비를 고름, 미디어 닫힘, 검색 칸 포커스, 무대는 모니터 없음, 방송 자막은 꺼짐</span>
</div>

<div class="pv-group">
<div class="ll-spec-title">좁은 창, 40, 버튼 32, 검색 칸 280</div>
<header class="ll-toolbar ll-toolbar--compact" style="box-shadow: 0 0 0 1px var(--line)">
<div class="ll-toolbar__group" role="tablist" aria-label="작업 공간">
<button type="button" class="ll-tbtn ll-tbtn--tab ll-tbtn--compact" role="tab" aria-selected="true"><span class="ll-i ll-i-slides"></span><span class="ll-tbtn__label">진행</span></button>
<button type="button" class="ll-tbtn ll-tbtn--tab ll-tbtn--compact" role="tab" aria-selected="false"><span class="ll-i ll-i-edit"></span><span class="ll-tbtn__label">준비</span></button>
<button type="button" class="ll-tbtn ll-tbtn--tab ll-tbtn--compact" role="tab" aria-selected="false"><span class="ll-i ll-i-gear"></span><span class="ll-tbtn__label">화면 설정</span></button>
</div>
<span class="ll-toolbar__divider"></span>
<button type="button" class="ll-tbtn ll-tbtn--toggle ll-tbtn--compact ll-tbtn--icon-only" aria-pressed="false" aria-label="미디어" title="미디어 열기"><span class="ll-i ll-i-film"></span></button>
<div class="ll-toolbar__center"><label class="ll-field ll-field--ring ll-toolbar__search"><span class="ll-i ll-field__icon ll-i-search"></span><input class="ll-field__input" type="search" aria-label="검색" placeholder="곡, 가사, 초성"></label></div>
<button type="button" class="ll-tbtn ll-tbtn--menu ll-tbtn--compact" aria-haspopup="menu" aria-expanded="false" title="Look 고르기"><span class="ll-i ll-i-layers"></span><span class="ll-tbtn__label">평상시</span><span class="ll-i ll-tbtn__chevron ll-i-down"></span></button>
<span class="ll-toolbar__divider"></span>
<div class="ll-toolbar__group" role="group" aria-label="화면 출력">
<button type="button" class="ll-tbtn ll-tbtn--output ll-tbtn--compact" aria-pressed="true" data-state="live" title="본 화면 출력 끄기 (모니터 2)"><span class="ll-tbtn__icon"><span class="ll-i ll-i-mplay"></span><span class="ll-tbtn__dot"></span></span><span class="ll-tbtn__label">본 화면</span></button>
<button type="button" class="ll-tbtn ll-tbtn--output ll-tbtn--compact" aria-pressed="true" data-state="live" title="무대 화면 출력 끄기 (모니터 3)"><span class="ll-tbtn__icon"><span class="ll-i ll-i-mplay"></span><span class="ll-tbtn__dot"></span></span><span class="ll-tbtn__label">무대</span></button>
<button type="button" class="ll-tbtn ll-tbtn--output ll-tbtn--compact" aria-pressed="false" data-state="off" title="방송 자막 출력 켜기 (NDI)"><span class="ll-tbtn__icon"><span class="ll-i ll-i-capture"></span><span class="ll-tbtn__dot"></span></span><span class="ll-tbtn__label">방송 자막</span></button>
</div>
</header>
<span class="ll-spec-label">미디어는 아이콘만, 이름은 아이콘 오른쪽</span>
</div>

</div>
</body>
</html>
