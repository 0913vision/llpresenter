<!-- @dsCard group="입력" height=480 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LabelColorPicker</title>
</head>
<body>
<div class="ll-preview">

  <div class="ll-spec-title">색 칸, 누르는 곳 24, 색 16</div>
  <div class="ll-spec" style="padding: 14px; border-radius: 6px; background: var(--bg-raised)">
    <div class="ll-spec-item">
      <div class="ll-swatches" role="radiogroup" aria-label="후렴 색">
        <button type="button" class="ll-swatch ll-swatch--none" role="radio" aria-checked="false" aria-label="없음"><span class="ll-swatch__chip"><span class="ll-i ll-i-x"></span></span></button>
        <button type="button" class="ll-swatch ll-swatch--teal" role="radio" aria-checked="false" aria-label="청록"><span class="ll-swatch__chip"></span></button>
        <button type="button" class="ll-swatch ll-swatch--green" role="radio" aria-checked="false" aria-label="초록"><span class="ll-swatch__chip"></span></button>
        <button type="button" class="ll-swatch ll-swatch--yellow" role="radio" aria-checked="true" aria-label="노랑"><span class="ll-swatch__chip"></span></button>
        <button type="button" class="ll-swatch ll-swatch--orange" role="radio" aria-checked="false" aria-label="주황"><span class="ll-swatch__chip"></span></button>
        <button type="button" class="ll-swatch ll-swatch--rose" role="radio" aria-checked="false" aria-label="분홍"><span class="ll-swatch__chip"></span></button>
        <button type="button" class="ll-swatch ll-swatch--violet" role="radio" aria-checked="false" aria-label="보라"><span class="ll-swatch__chip"></span></button>
        <button type="button" class="ll-swatch ll-swatch--slate" role="radio" aria-checked="false" aria-label="남색"><span class="ll-swatch__chip"></span></button>
        <button type="button" class="ll-swatch ll-swatch--gray" role="radio" aria-checked="false" aria-label="회색"><span class="ll-swatch__chip"></span></button>
      </div>
      <span class="ll-spec-label">없음, 청록, 초록, 노랑, 주황, 분홍, 보라, 남색, 회색</span>
    </div>
  </div>
  <div class="ll-spec" style="padding: 14px; border-radius: 6px; background: var(--bg-raised)">
    <div class="ll-spec-item"><button type="button" class="ll-swatch ll-swatch--teal" role="radio" aria-checked="false" aria-label="청록"><span class="ll-swatch__chip"></span></button><span class="ll-spec-label">기본</span></div>
    <div class="ll-spec-item"><button type="button" class="ll-swatch ll-swatch--teal is-hover" role="radio" aria-checked="false" aria-label="청록"><span class="ll-swatch__chip"></span></button><span class="ll-spec-label">마우스 올림</span></div>
    <div class="ll-spec-item"><button type="button" class="ll-swatch ll-swatch--teal" role="radio" aria-checked="true" aria-label="청록"><span class="ll-swatch__chip"></span></button><span class="ll-spec-label">고름, text 2px</span></div>
    <div class="ll-spec-item"><button type="button" class="ll-swatch ll-swatch--teal is-focus" role="radio" aria-checked="true" aria-label="청록"><span class="ll-swatch__chip"></span></button><span class="ll-spec-label">고름, 포커스</span></div>
    <div class="ll-spec-item"><button type="button" class="ll-swatch ll-swatch--none" role="radio" aria-checked="false" aria-label="없음"><span class="ll-swatch__chip"><span class="ll-i ll-i-x"></span></span></button><span class="ll-spec-label">없음</span></div>
    <div class="ll-spec-item"><button type="button" class="ll-swatch ll-swatch--none" role="radio" aria-checked="true" aria-label="없음"><span class="ll-swatch__chip"><span class="ll-i ll-i-x"></span></span></button><span class="ll-spec-label">없음, 고름</span></div>
  </div>

  <div class="ll-spec" style="align-items: flex-start">
    <div class="ll-spec-item">
      <div class="ll-spec-title">이름표 메뉴 안, 라이브러리 곡 편집</div>
      <div class="ll-menu" role="menu" aria-label="이름표" style="width: 280px">
        <button type="button" class="ll-menu__item" role="menuitemradio" aria-checked="false"><span class="ll-menu__lead"></span><span class="ll-menu__swatch" data-color="teal"></span><span class="ll-menu__label">1절</span></button>
        <button type="button" class="ll-menu__item" role="menuitemradio" aria-checked="false"><span class="ll-menu__lead"></span><span class="ll-menu__swatch" data-color="green"></span><span class="ll-menu__label">프리코러스</span></button>
        <button type="button" class="ll-menu__item" role="menuitemradio" aria-checked="true"><span class="ll-menu__lead"><span class="ll-i ll-i-14 ll-i-check"></span></span><span class="ll-menu__swatch" data-color="yellow"></span><span class="ll-menu__label">후렴</span></button>
        <div class="ll-menu__sep" role="separator"></div>
        <div class="ll-swatches ll-swatches--menu" role="radiogroup" aria-label="후렴 색">
          <button type="button" class="ll-swatch ll-swatch--none" role="radio" aria-checked="false" aria-label="없음"><span class="ll-swatch__chip"><span class="ll-i ll-i-x"></span></span></button>
          <button type="button" class="ll-swatch ll-swatch--teal" role="radio" aria-checked="false" aria-label="청록"><span class="ll-swatch__chip"></span></button>
          <button type="button" class="ll-swatch ll-swatch--green" role="radio" aria-checked="false" aria-label="초록"><span class="ll-swatch__chip"></span></button>
          <button type="button" class="ll-swatch ll-swatch--yellow" role="radio" aria-checked="true" aria-label="노랑"><span class="ll-swatch__chip"></span></button>
          <button type="button" class="ll-swatch ll-swatch--orange" role="radio" aria-checked="false" aria-label="주황"><span class="ll-swatch__chip"></span></button>
          <button type="button" class="ll-swatch ll-swatch--rose" role="radio" aria-checked="false" aria-label="분홍"><span class="ll-swatch__chip"></span></button>
          <button type="button" class="ll-swatch ll-swatch--violet" role="radio" aria-checked="false" aria-label="보라"><span class="ll-swatch__chip"></span></button>
          <button type="button" class="ll-swatch ll-swatch--slate" role="radio" aria-checked="false" aria-label="남색"><span class="ll-swatch__chip"></span></button>
          <button type="button" class="ll-swatch ll-swatch--gray" role="radio" aria-checked="false" aria-label="회색"><span class="ll-swatch__chip"></span></button>
        </div>
        <div class="ll-menu__sep" role="separator"></div>
        <button type="button" class="ll-menu__item" role="menuitem"><span class="ll-menu__lead"><span class="ll-i ll-i-14 ll-i-plus"></span></span><span class="ll-menu__label">새 이름표</span></button>
      </div>
      <span class="ll-spec-label">색 줄 28, 첫 색을 항목의 앞 칸에 맞춤</span>
    </div>
    <div class="ll-spec-item">
      <div class="ll-spec-title">매크로 우클릭 메뉴, 색 줄</div>
      <div class="ll-menu" role="menu" aria-label="예배 시작" style="width: 240px">
        <button type="button" class="ll-menu__item" role="menuitem"><span class="ll-menu__label">이름 바꾸기</span></button>
        <button type="button" class="ll-menu__item" role="menuitem"><span class="ll-menu__label">아이콘 바꾸기</span></button>
        <div class="ll-swatches ll-swatches--menu" role="radiogroup" aria-label="색">
          <span class="ll-swatches__label">색</span>
          <button type="button" class="ll-swatch ll-swatch--teal" role="radio" aria-checked="false" aria-label="청록"><span class="ll-swatch__chip"></span></button>
          <button type="button" class="ll-swatch ll-swatch--green" role="radio" aria-checked="true" aria-label="초록"><span class="ll-swatch__chip"></span></button>
          <button type="button" class="ll-swatch ll-swatch--yellow" role="radio" aria-checked="false" aria-label="노랑"><span class="ll-swatch__chip"></span></button>
          <button type="button" class="ll-swatch ll-swatch--orange" role="radio" aria-checked="false" aria-label="주황"><span class="ll-swatch__chip"></span></button>
          <button type="button" class="ll-swatch ll-swatch--rose" role="radio" aria-checked="false" aria-label="분홍"><span class="ll-swatch__chip"></span></button>
          <button type="button" class="ll-swatch ll-swatch--violet" role="radio" aria-checked="false" aria-label="보라"><span class="ll-swatch__chip"></span></button>
          <button type="button" class="ll-swatch ll-swatch--slate" role="radio" aria-checked="false" aria-label="남색"><span class="ll-swatch__chip"></span></button>
          <button type="button" class="ll-swatch ll-swatch--gray" role="radio" aria-checked="false" aria-label="회색"><span class="ll-swatch__chip"></span></button>
        </div>
        <div class="ll-menu__sep" role="separator"></div>
        <button type="button" class="ll-menu__item" role="menuitem" aria-haspopup="menu"><span class="ll-menu__label">동작 추가</span><span class="ll-i ll-i-12 ll-i-right ll-menu__chevron"></span></button>
      </div>
      <span class="ll-spec-label">매크로는 없음이 없음, 메뉴 너비 240</span>
    </div>
  </div>

</div>
</body>
</html>
