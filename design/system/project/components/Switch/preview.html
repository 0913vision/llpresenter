<!-- @dsCard group="Inputs" height=410 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Switch</title>
</head>
<body>
<div class="ll-preview">

  <div class="ll-spec-title">Switch 30×18</div>
  <div class="ll-on-panel">
    <div class="ll-spec">
      <div class="ll-spec-item"><button type="button" class="ll-switch" role="switch" aria-checked="false" aria-label="꺼짐"></button><span class="ll-spec-label">Off</span></div>
      <div class="ll-spec-item"><button type="button" class="ll-switch" role="switch" aria-checked="true" aria-label="켜짐"></button><span class="ll-spec-label">On</span></div>
      <div class="ll-spec-item"><button type="button" class="ll-switch is-focus" role="switch" aria-checked="false" aria-label="포커스"></button><span class="ll-spec-label">Focus</span></div>
      <div class="ll-spec-item"><button type="button" class="ll-switch is-focus" role="switch" aria-checked="true" aria-label="켜짐 포커스"></button><span class="ll-spec-label">On, focus</span></div>
      <div class="ll-spec-item"><button type="button" class="ll-switch" role="switch" aria-checked="false" aria-label="쓸 수 없음" disabled></button><span class="ll-spec-label">Disabled, off</span></div>
      <div class="ll-spec-item"><button type="button" class="ll-switch" role="switch" aria-checked="true" aria-label="쓸 수 없음 켜짐" disabled></button><span class="ll-spec-label">Disabled, on</span></div>
    </div>
  </div>

  <div class="ll-spec" style="align-items: flex-start">
    <div class="ll-spec-item">
      <div class="ll-spec-title">Preferences, name 168, row 38</div>
      <div class="ll-props ll-props--window" style="box-sizing: border-box; width: 560px; padding: 0 24px; border-radius: 5px; background: var(--bg-panel)">
        <div class="ll-prop-group">
          <p class="ll-prop-group__title">보고</p>
          <div class="ll-prop"><label class="ll-prop__label" for="sw-a">오류 보고 보내기</label><span class="ll-prop__control"><button type="button" id="sw-a" class="ll-switch" role="switch" aria-checked="true"></button></span></div>
          <div class="ll-prop"><label class="ll-prop__label" for="sw-b">사용 통계 보내기</label><span class="ll-prop__control"><button type="button" id="sw-b" class="ll-switch" role="switch" aria-checked="false"></button></span></div>
        </div>
      </div>
      <span class="ll-spec-label">Switch at the left end of the control cell</span>
    </div>
    <div class="ll-spec-item">
      <div class="ll-spec-title">Panel property field, name 84, row 36</div>
      <div class="ll-props" style="box-sizing: border-box; width: 320px; padding: 0 14px; border-radius: 5px; background: var(--bg-panel)">
        <div class="ll-prop-group">
          <p class="ll-prop-group__title">안정성</p>
          <div class="ll-prop"><label class="ll-prop__label" for="sw-c">항상 위</label><span class="ll-prop__control"><button type="button" id="sw-c" class="ll-switch" role="switch" aria-checked="true"></button></span></div>
          <div class="ll-prop"><label class="ll-prop__label" for="sw-d">절전 막기</label><span class="ll-prop__control"><button type="button" id="sw-d" class="ll-switch" role="switch" aria-checked="false"></button></span></div>
        </div>
      </div>
      <span class="ll-spec-label">화면 설정 (Screen settings)</span>
    </div>
  </div>

  <div class="ll-spec" style="align-items: flex-start">
    <div class="ll-spec-item">
      <div class="ll-on-panel"><label class="ll-switch-row">이름표 인식<button type="button" class="ll-switch" role="switch" aria-checked="true"></button></label></div>
      <span class="ll-spec-label">Name + switch, text import settings row</span>
    </div>
    <div class="ll-spec-item">
      <div class="ll-on-panel"><label class="ll-switch-row">이름표 인식<button type="button" class="ll-switch" role="switch" aria-checked="true" disabled></button></label></div>
      <span class="ll-spec-label">Disabled</span>
    </div>
  </div>

</div>
</body>
</html>
