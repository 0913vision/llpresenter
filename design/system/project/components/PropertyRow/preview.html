<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>PropertyRow</title>
</head>
<body>
<div class="ll-preview">

  <div class="ll-spec" style="align-items: flex-start">
    <div class="ll-spec-item">
      <div class="ll-spec-title">Panel, name 84, gap 12, row 36</div>
      <section class="ll-panel" style="width: 440px" aria-label="항목 설정">
        <div class="ll-panel__header"><div class="ll-panel__tabs" role="tablist"><button type="button" class="ll-panel__tab" role="tab" aria-selected="true">항목 설정</button></div></div>
        <div class="ll-props" style="padding: 4px 14px 14px">
          <div class="ll-prop-group">
            <p class="ll-prop-group__title">원본</p>
            <div class="ll-prop">
              <span class="ll-prop__label">곡</span>
              <span class="ll-prop__control"><span class="ll-prop__value ll-prop__value--primary"><span class="ll-i ll-i-link"></span>만복의 근원 하나님</span><span class="ll-prop__meta">라이브러리</span><button type="button" class="ll-iconbtn" aria-label="라이브러리 곡 열기" style="margin-left: auto"><span class="ll-i ll-i-open"></span></button></span>
            </div>
          </div>
          <div class="ll-prop-group">
            <p class="ll-prop-group__title">이번 예배</p>
            <div class="ll-prop">
              <span class="ll-prop__label">배경</span>
              <span class="ll-prop__control"><button type="button" class="ll-select ll-select--block" aria-haspopup="listbox" aria-expanded="false"><img class="ll-select__media" src="/_blob/a52f8166b3e4175cb8ae640545551821" alt=""><span class="ll-select__value">따뜻한 빛</span><span class="ll-select__meta">곡 기본값</span><span class="ll-i ll-i-down ll-select__chevron"></span></button></span>
            </div>
            <div class="ll-prop">
              <span class="ll-prop__label">시작할 때</span>
              <span class="ll-prop__control"><button type="button" class="ll-select ll-select--block" aria-haspopup="listbox" aria-expanded="false"><span class="ll-select__tile ll-select__tile--teal"><span class="ll-i ll-i-song"></span></span><span class="ll-select__value">찬양</span><span class="ll-select__meta">매크로</span><span class="ll-i ll-i-down ll-select__chevron"></span></button></span>
            </div>
          </div>
          <div class="ll-prop-group">
            <p class="ll-prop-group__title"><span class="ll-i ll-i-note"></span>메모</p>
            <textarea class="ll-textarea" aria-label="메모" style="margin-top: 4px">마지막 후렴은 천천히
인도자 신호 보고 끝내기</textarea>
          </div>
        </div>
      </section>
    </div>

    <div class="ll-spec-item">
      <div class="ll-spec-title">Panel, 화면 설정 properties</div>
      <section class="ll-panel" style="width: 440px" aria-label="속성">
        <div class="ll-panel__header"><div class="ll-panel__tabs" role="tablist"><button type="button" class="ll-panel__tab" role="tab" aria-selected="true">속성</button></div><span class="ll-panel__meta">본 화면</span></div>
        <div class="ll-props" style="padding: 4px 14px 14px">
          <div class="ll-prop-group">
            <p class="ll-prop-group__title">화면</p>
            <div class="ll-prop">
              <label class="ll-prop__label" for="pr-name">이름</label>
              <span class="ll-prop__control"><span class="ll-field ll-field--block"><input id="pr-name" class="ll-field__input" value="본 화면"></span></span>
            </div>
            <div class="ll-prop">
              <span class="ll-prop__label">종류</span>
              <span class="ll-prop__control"><span class="ll-seg ll-seg--fill" role="radiogroup" aria-label="종류"><button type="button" class="ll-seg__item" role="radio" aria-checked="true">청중</button><button type="button" class="ll-seg__item" role="radio" aria-checked="false">무대</button></span></span>
            </div>
          </div>
          <div class="ll-prop-group">
            <p class="ll-prop-group__title">출력</p>
            <div class="ll-prop">
              <span class="ll-prop__label">장치</span>
              <span class="ll-prop__control"><button type="button" class="ll-select ll-select--block" aria-haspopup="listbox" aria-expanded="false"><span class="ll-select__value">모니터 2</span><span class="ll-select__meta">EPSON 프로젝터</span><span class="ll-i ll-i-down ll-select__chevron"></span></button></span>
            </div>
            <div class="ll-prop">
              <span class="ll-prop__label">해상도</span>
              <span class="ll-prop__control"><button type="button" class="ll-select ll-select--block" aria-haspopup="listbox" aria-expanded="false"><span class="ll-select__value ll-num">1920×1080</span><span class="ll-i ll-i-down ll-select__chevron"></span></button></span>
            </div>
            <div class="ll-prop">
              <span class="ll-prop__label">주사율</span>
              <span class="ll-prop__control"><span class="ll-prop__value">60Hz</span></span>
            </div>
          </div>
          <div class="ll-prop-group">
            <p class="ll-prop-group__title">보정</p>
            <div class="ll-prop">
              <label class="ll-prop__label" for="pr-edge">가장자리 여백</label>
              <span class="ll-prop__control"><span class="ll-field ll-field--num"><input id="pr-edge" class="ll-field__input" value="0%"></span></span>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <div class="ll-spec" style="align-items: flex-start">
    <div class="ll-spec-item">
      <div class="ll-spec-title">Window, Preferences, name 168, gap 16, control cell 340, row 38</div>
      <div class="ll-props ll-props--window" style="box-sizing: border-box; width: 640px; padding: 0 24px 8px; border-radius: 5px; background: var(--bg-panel)">
        <div class="ll-prop-group">
          <p class="ll-prop-group__title">저장</p>
          <div class="ll-prop">
            <span class="ll-prop__label">자동 저장</span>
            <span class="ll-prop__control"><button type="button" class="ll-select ll-select--block" aria-haspopup="listbox" aria-expanded="false"><span class="ll-select__value">1분마다</span><span class="ll-i ll-i-down ll-select__chevron"></span></button></span>
          </div>
          <div class="ll-prop">
            <label class="ll-prop__label" for="pr-copies">복구 사본</label>
            <span class="ll-prop__control"><span class="ll-field ll-field--num"><input id="pr-copies" class="ll-field__input" value="10"></span><span class="ll-field-unit">개</span></span>
          </div>
        </div>
        <div class="ll-prop-group">
          <p class="ll-prop-group__title">백업</p>
          <div class="ll-prop">
            <label class="ll-prop__label" for="pr-backup">자동 백업</label>
            <span class="ll-prop__control"><button type="button" id="pr-backup" class="ll-switch" role="switch" aria-checked="true"></button></span>
          </div>
          <div class="ll-prop">
            <span class="ll-prop__label">마지막 백업</span>
            <span class="ll-prop__control"><span class="ll-prop__value" style="flex: 1">오늘 07:58</span><button type="button" class="ll-btn ll-btn--md">지금 백업</button></span>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
