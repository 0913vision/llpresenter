<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
const header = (label) => ({ isHeader: true, isItem: false, label: label });
const list = (title, kind, count, sel) => ({
isHeader: false, isItem: true, title: title, count: count,
isAll: kind === 'all', isList: kind === 'list', isImages: kind === 'images',
bg: sel ? '#1f4170' : 'transparent', iconColor: sel ? '#ececec' : '#b4b4b4', countColor: sel ? '#b4c6e0' : '#8c8c8c'

],
audioLists: [

{ title: '헌금 연주', count: '2', isTrack: true, isEffect: false },
{ title: '효과음', count: '3', isTrack: false, isEffect: true }
],
items: [
item('따뜻한 빛', 'e96d6204449f1e44237721b22d7463c9', '0:30', true),
item('푸른 빛줄기', '85c85c8365a93673f8757a855a5ae71e', '0:45'),

item('새벽 능선', 'a26fea38dfbc6c6a6ebbe467c651a3bf', '1:20'),
Object.assign(item('부활절 배경.mp4', '18a41d6fa76a5bf859efd17846f95d68', ''), { ready: false, importing: true, fg: '#8c8c8c' })
],
tabs: ['속성', '정보', '전환', '소리'].map((t, i) => ({ label: t, line: i === 0 ? '#ececec' : 'transparent', fg: i === 0 ? '#ececec' : '#8c8c8c', weight: 600 })),
groups: [

]
};
}
}
