@@HEAD:무대 화면 배치 편집@@
<div style="width: 1920px; height: 1080px; display: flex; flex-direction: column; background: #0e0e0e; color: #ececec; font-family: 'Pretendard Variable', Pretendard, sans-serif; font-size: 13px; line-height: 18px; word-break: keep-all; -webkit-font-smoothing: antialiased; overflow: hidden">

@@MENUBAR@@

@@TOOLBAR:screens@@

<div style="flex: 1; min-height: 0; display: flex; gap: 4px; padding: 0 4px">

<div style="flex: 0 0 280px; display: flex; flex-direction: column; gap: 4px">
<section style="flex: 1; min-height: 0; display: flex; flex-direction: column; background: #1c1c1c; border-radius: 5px; overflow: hidden" aria-label="무대 배치">
<div style="flex: none; box-sizing: border-box; height: 34px; display: flex; align-items: center; padding: 0 8px 0 14px; border-bottom: 1px solid #2b2b2b">
<span style="font-size: 12px; font-weight: 600; line-height: 31px; border-bottom: 2px solid #ececec">무대 배치</span>
<button type="button" class="hv" aria-label="새 배치" style="margin-left: auto; width: 26px; height: 26px; border: 0; border-radius: 4px; background: transparent; color: #b4b4b4; display: inline-flex; align-items: center; justify-content: center"><span class="i i-plus"></span></button>
</div>
<ul style="margin: 0; padding: 4px 0 8px; list-style: none">
<sc-for list="{{ layouts }}" as="l" hint-placeholder-count="4">
<li><button type="button" class="hv" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 48px; padding: 0 14px; border: 0; background: {{ l.bg }}; color: #ececec; text-align: left">
<span style="position: relative; flex: none; width: 56px; height: 32px; border-radius: 2px; background: #000; box-shadow: 0 0 0 1px {{ l.thumbLine }}; overflow: hidden">
<sc-for list="{{ l.parts }}" as="p" hint-placeholder-count="4"><span style="position: absolute; left: {{ p.x }}; top: {{ p.y }}; width: {{ p.w }}; height: {{ p.h }}; border-radius: 1px; background: {{ p.c }}"></span></sc-for>
</span>
<span style="flex: 1; min-width: 0; font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{ l.name }}</span>
<sc-if value="{{ l.inUse }}" hint-placeholder-val="{{ false }}"><span style="height: 18px; padding: 0 6px; border-radius: 3px; background: {{ l.chipBg }}; color: #ececec; font-size: 11px; line-height: 18px">사용 중</span></sc-if>
</button></li>
</sc-for>
</ul>
</section>

<section style="flex: none; display: flex; flex-direction: column; background: #1c1c1c; border-radius: 5px; overflow: hidden" aria-label="무대 화면">
<div style="flex: none; box-sizing: border-box; height: 34px; display: flex; align-items: center; padding: 0 8px 0 14px; border-bottom: 1px solid #2b2b2b">
<span style="font-size: 12px; font-weight: 600; line-height: 31px; border-bottom: 2px solid #ececec">무대 화면</span>
</div>
<div style="padding: 6px 14px 12px">
<div style="display: flex; align-items: center; gap: 10px; height: 40px">
<span class="i i-monitor" style="color: #b4b4b4"></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px">무대 화면</span><span style="font-size: 11px; line-height: 14px; color: #8c8c8c">모니터 3</span></span>
<span style="width: 6px; height: 6px; border-radius: 50%; background: #3dbb6b" aria-label="정상"></span>
</div>
<div style="display: flex; align-items: center; gap: 12px; height: 36px">
<span style="flex: 0 0 40px; font-size: 12px; color: #b4b4b4">배치</span>
<button type="button" class="hvc" style="flex: 1; display: flex; align-items: center; height: 30px; padding: 0 8px 0 10px; border: 0; border-radius: 4px; background: #2a2a2a; color: #ececec; font-size: 13px; text-align: left"><span style="flex: 1">현재와 다음</span><span class="i i12 i-down" style="color: #8c8c8c"></span></button>
</div>
</div>
</section>
</div>

<section style="flex: 1; min-width: 0; display: flex; flex-direction: column; background: #1c1c1c; border-radius: 5px; overflow: hidden" aria-label="배치 편집">
<div style="flex: none; box-sizing: border-box; height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; border-bottom: 1px solid #2b2b2b">
<span style="display: flex; align-items: baseline; gap: 10px"><span style="font-size: 13px; font-weight: 600">현재와 다음</span><span style="font-size: 12px; color: #8c8c8c; font-variant-numeric: tabular-nums">1920×1080</span></span>
<button type="button" class="hvc" style="margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px 0 8px; border: 0; border-radius: 4px; background: #2a2a2a; color: #ececec; font-size: 12px"><span class="i i14 i-plus"></span>요소 추가<span class="i i12 i-down" style="color: #8c8c8c"></span></button>
</div>

<div style="flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: #161616">
<div style="position: relative; width: 1024px; height: 576px; background: #000; box-shadow: 0 0 0 1px #2b2b2b">

<div style="position: absolute; left: 24px; top: 26px; width: 176px; height: 21px; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; gap: 7px; outline: 1px dashed rgba(255, 255, 255, 0.22)"><span style="width: 9px; height: 9px; border-radius: 2px; background: #8fbf7a"></span><span style="font-size: 13px; font-weight: 700; color: #8fbf7a">프리코러스</span></div>

<div style="position: absolute; left: 24px; top: 53px; width: 637px; height: 139px; box-sizing: border-box; padding: 0 8px; box-shadow: 0 0 0 1px #3d8bf0">
<p style="margin: 0; color: #fff; font-size: 38px; line-height: 52px; font-weight: 700; white-space: pre-line">{{ lyric }}</p>
<span style="position: absolute; left: -1px; top: calc(100% + 5px); height: 18px; padding: 0 6px; border-radius: 3px; background: #2a70dc; color: #fff; font-size: 11px; line-height: 18px; font-weight: 600">현재 가사</span>
<sc-for list="{{ handles }}" as="h" hint-placeholder-count="8"><span style="position: absolute; left: {{ h.x }}; top: {{ h.y }}; width: 8px; height: 8px; margin: -4px 0 0 -4px; box-sizing: border-box; border-radius: 2px; background: #fff; box-shadow: 0 0 0 1px #3d8bf0"></span></sc-for>
</div>

<div style="position: absolute; left: 768px; top: 32px; width: 224px; height: 64px; display: flex; align-items: center; justify-content: flex-end; outline: 1px dashed rgba(255, 255, 255, 0.22)"><span style="font-size: 51px; line-height: 60px; font-weight: 700; font-variant-numeric: tabular-nums">11:24</span></div>

<div style="position: absolute; left: 768px; top: 101px; width: 224px; height: 32px; display: flex; align-items: center; justify-content: flex-end; gap: 10px; outline: 1px dashed rgba(255, 255, 255, 0.22)"><span style="font-size: 15px; color: #8c8c8c">예배 경과</span><span style="font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums">00:54</span></div>

<div style="position: absolute; left: 24px; top: 251px; width: 637px; height: 117px; box-sizing: border-box; padding: 0 8px; outline: 1px dashed rgba(255, 255, 255, 0.22)">
<p style="margin: 0 0 6px; display: flex; align-items: center; gap: 7px; font-size: 15px; line-height: 20px; font-weight: 700; color: #8c8c8c">다음<span style="width: 9px; height: 9px; margin-left: 3px; border-radius: 2px; background: #d6b35f"></span><span style="color: #d6b35f">후렴</span></p>
<p style="margin: 0; color: #9a9a9a; font-size: 30px; line-height: 40px; font-weight: 600; white-space: pre-line">{{ next }}</p>
</div>

<div style="position: absolute; left: 0; top: 512px; width: 1024px; height: 64px; display: flex; align-items: center; padding: 0 32px; box-sizing: border-box; background: #e3a23b; color: #111; font-size: 28px; font-weight: 700; outline: 1px dashed rgba(255, 255, 255, 0.22); outline-offset: -1px">후렴 한 번 더</div>

</div>
</div>

<div style="flex: none; height: 44px; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-top: 1px solid #2b2b2b">
<sc-for list="{{ geometry }}" as="g" hint-placeholder-count="4">
<span style="display: inline-flex; align-items: center; gap: 8px"><span style="font-size: 11px; color: #8c8c8c">{{ g.label }}</span><span style="width: 64px; display: flex; align-items: center; justify-content: flex-end; height: 26px; padding: 0 8px; box-sizing: border-box; border-radius: 4px; background: #121212; font-size: 12px; font-variant-numeric: tabular-nums">{{ g.value }}</span></span>
</sc-for>
<button type="button" class="hv" aria-label="비율 고정" aria-pressed="false" style="width: 26px; height: 26px; border: 0; border-radius: 4px; background: transparent; color: #b4b4b4; display: inline-flex; align-items: center; justify-content: center"><span class="i i-lock"></span></button>
<button type="button" class="hv" aria-label="격자에 맞추기" aria-pressed="true" style="margin-left: auto; width: 26px; height: 26px; border: 0; border-radius: 4px; background: #333333; color: #ececec; display: inline-flex; align-items: center; justify-content: center"><span class="i i-grid"></span></button>
<span style="font-size: 12px; color: #8c8c8c; font-variant-numeric: tabular-nums">53%</span>
</div>
</section>

<section style="flex: 0 0 480px; display: flex; flex-direction: column; background: #1c1c1c; border-radius: 5px; overflow: hidden" aria-label="요소 속성">
<div style="flex: none; box-sizing: border-box; height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 14px; border-bottom: 1px solid #2b2b2b">
<span style="font-size: 12px; font-weight: 600; line-height: 31px; border-bottom: 2px solid #ececec">요소</span>
<span style="font-size: 12px; color: #8c8c8c">현재 가사</span>
<button type="button" class="hv" aria-label="요소 삭제" style="margin-left: auto; width: 26px; height: 26px; border: 0; border-radius: 4px; background: transparent; color: #b4b4b4; display: inline-flex; align-items: center; justify-content: center"><span class="i i-trash"></span></button>
</div>
<div style="padding: 4px 14px 14px">
<div style="padding: 12px 0 8px; border-bottom: 1px solid #2b2b2b">
<p style="margin: 0 0 4px; font-size: 11px; line-height: 14px; font-weight: 600; color: #8c8c8c">내용</p>
<div style="display: flex; align-items: center; gap: 12px; height: 36px">
<span style="flex: 0 0 84px; font-size: 12px; color: #b4b4b4">이름</span>
<span style="flex: 1; display: flex; align-items: center; height: 30px; padding: 0 10px; border-radius: 4px; background: #121212; font-size: 13px">현재 가사</span>
</div>
<div style="display: flex; align-items: center; gap: 12px; height: 36px">
<span style="flex: 0 0 84px; font-size: 12px; color: #b4b4b4">내용 종류</span>
<button type="button" class="hvc" style="flex: 1; display: flex; align-items: center; height: 30px; padding: 0 8px 0 10px; border: 0; border-radius: 4px; background: #2a2a2a; color: #ececec; font-size: 13px; text-align: left"><span style="flex: 1">현재 장</span><span class="i i12 i-down" style="color: #8c8c8c"></span></button>
</div>
<div style="display: flex; align-items: center; gap: 12px; height: 36px">
<span style="flex: 0 0 84px; font-size: 12px; color: #b4b4b4">보여 줄 것</span>
<span style="flex: 1; display: flex; padding: 2px; border-radius: 5px; background: #121212"><sc-for list="{{ show }}" as="o" hint-placeholder-count="3"><button type="button" style="flex: 1; height: 22px; padding: 0 8px; border: 0; border-radius: 3px; background: {{ o.bg }}; color: {{ o.fg }}; font-size: 12px">{{ o.label }}</button></sc-for></span>
</div>
</div>

<div style="display: flex; padding: 14px 0 4px">
<span style="flex: 1; display: flex; padding: 2px; border-radius: 5px; background: #121212"><sc-for list="{{ inspectorTabs }}" as="o" hint-placeholder-count="2"><button type="button" style="flex: 1; height: 22px; padding: 0 8px; border: 0; border-radius: 3px; background: {{ o.bg }}; color: {{ o.fg }}; font-size: 12px; font-weight: 400">{{ o.label }}</button></sc-for></span>
</div>

<div style="padding: 8px 0 6px">
<sc-for list="{{ textRows }}" as="r" hint-placeholder-count="8">
<div style="display: flex; align-items: center; gap: 12px; height: 36px">
<span style="flex: 0 0 84px; font-size: 12px; color: #b4b4b4">{{ r.label }}</span>
<sc-if value="{{ r.isSelect }}" hint-placeholder-val="{{ true }}"><button type="button" class="hvc" style="flex: 1; display: flex; align-items: center; height: 30px; padding: 0 8px 0 10px; border: 0; border-radius: 4px; background: #2a2a2a; color: #ececec; font-size: 13px; text-align: left"><span style="flex: 1">{{ r.value }}</span><span class="i i12 i-down" style="color: #8c8c8c"></span></button></sc-if>
<sc-if value="{{ r.isNumber }}" hint-placeholder-val="{{ false }}"><span style="width: 96px; display: flex; align-items: center; justify-content: flex-end; height: 30px; padding: 0 10px; box-sizing: border-box; border-radius: 4px; background: #121212; font-size: 13px; font-variant-numeric: tabular-nums">{{ r.value }}</span></sc-if>
<sc-if value="{{ r.isColor }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px 0 6px; border-radius: 4px; background: #121212; font-size: 13px; font-variant-numeric: tabular-nums"><span style="width: 16px; height: 16px; border-radius: 3px; background: {{ r.color }}; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.3)"></span>{{ r.value }}</span></sc-if>
<sc-if value="{{ r.isSeg }}" hint-placeholder-val="{{ false }}"><span style="display: flex; padding: 2px; border-radius: 5px; background: #121212"><sc-for list="{{ r.options }}" as="o" hint-placeholder-count="3"><button type="button" aria-label="{{ o.label }}" style="min-width: 28px; height: 22px; padding: 0 {{ o.padX }}; border: 0; border-radius: 3px; background: {{ o.bg }}; color: {{ o.fg }}; font-size: 12px; display: inline-flex; align-items: center; justify-content: center"><sc-if value="{{ o.isLeft }}" hint-placeholder-val="{{ false }}"><span class="i i14 i-aleft"></span></sc-if><sc-if value="{{ o.isCenter }}" hint-placeholder-val="{{ false }}"><span class="i i14 i-acenter"></span></sc-if><sc-if value="{{ o.isWord }}" hint-placeholder-val="{{ true }}">{{ o.label }}</sc-if></button></sc-for></span></sc-if>
<sc-if value="{{ r.isSwitch }}" hint-placeholder-val="{{ false }}"><span role="switch" aria-checked="{{ r.checked }}" style="position: relative; width: 30px; height: 18px; border-radius: 9px; background: {{ r.track }}"><span style="position: absolute; top: 2px; left: {{ r.knob }}; width: 14px; height: 14px; border-radius: 50%; background: #ececec"></span></span></sc-if>
</div>
</sc-for>
</div>
</div>
</section>

</div>

@@FOOTER@@

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
const part = (x, y, w, h, c) => ({ x: x + '%', y: y + '%', w: w + '%', h: h + '%', c: c });
const white = '#ececec', gray = '#6e6e6e', amber = '#e3a23b';
const layout = (name, parts, inUse, sel) => ({
name: name, parts: parts, inUse: inUse, bg: sel ? '#1f4170' : 'transparent',
thumbLine: sel ? '#3d8bf0' : '#3a3a3a', chipBg: sel ? '#2c5594' : '#2a2a2a'
});
const seg = (labels, active, icons) => labels.map((l, i) => ({
label: l, bg: i === active ? '#333333' : 'transparent', fg: i === active ? '#ececec' : '#8c8c8c',
isLeft: !!icons && l === '왼쪽', isCenter: !!icons && l === '가운데', isWord: !icons, padX: icons ? '0' : '10px'
}));
const handlePoints = [[0, 0], [50, 0], [100, 0], [0, 50], [100, 50], [0, 100], [50, 100], [100, 100]];
return {
lyric: '저 천사여 찬송하세\n찬송 성부 성자 성령',
next: '찬송 성부 성자 성령\n아멘',
layouts: [
layout('현재와 다음', [part(6, 12, 55, 18, white), part(77, 8, 18, 10, white), part(6, 46, 55, 14, gray), part(0, 88, 100, 12, amber)], true, true),
layout('가사만', [part(8, 30, 84, 16, white), part(8, 52, 70, 16, white)], false, false),
layout('설교 타이머', [part(20, 30, 60, 34, white), part(30, 72, 40, 8, gray)], false, false),
layout('큰 메시지', [part(0, 30, 100, 40, amber)], false, false)
],
handles: handlePoints.map((p) => ({ x: p[0] + '%', y: p[1] + '%' })),
geometry: [['X', '45'], ['Y', '100'], ['W', '1194'], ['H', '260']].map((g) => ({ label: g[0], value: g[1] })),
show: seg(['글자', '그림', '메모'], 0),
inspectorTabs: seg(['모양', '글자'], 1),
textRows: [
{ label: '글꼴', isSelect: true, value: 'Pretendard' },
{ label: '굵기', isSelect: true, value: 'Bold' },
{ label: '크기', isNumber: true, value: '72' },
{ label: '글자색', isColor: true, value: '#FFFFFF', color: '#ffffff' },
{ label: '가로 정렬', isSeg: true, options: seg(['왼쪽', '가운데'], 0, true) },
{ label: '세로 정렬', isSeg: true, options: seg(['위', '가운데', '아래'], 0) },
{ label: '줄 간격', isNumber: true, value: '1.3' },
{ label: '크기 자동 맞춤', isSwitch: true, checked: 'true', track: '#2a70dc', knob: '14px' }
]
};
}
}
</script>
</body>
</html>
