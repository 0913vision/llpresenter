@@HEAD:다중 레이어 지우기@@
<div style="width: 1204px; height: 552px; box-sizing: border-box; padding: 16px; display: flex; align-items: flex-start; gap: 32px; background: #0e0e0e; color: #ececec; font-family: 'Pretendard Variable', Pretendard, sans-serif; font-size: 13px; line-height: 18px; word-break: keep-all; -webkit-font-smoothing: antialiased; overflow: hidden">

<div style="position: relative; flex: none; width: 480px; height: 520px">
<section style="display: flex; flex-direction: column; gap: 6px; padding: 8px; background: #1c1c1c; border-radius: 5px" aria-label="지우기">
<div style="display: flex; align-items: center; gap: 4px">
<sc-for list="{{ clears }}" as="c" hint-placeholder-count="7">
<button type="button" class="hvc" title="{{ c.label }}" style="flex: {{ c.flex }}; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; border-radius: 4px; background: {{ c.bg }}; color: {{ c.fg }}; font-size: 11px; font-weight: 600">
<span class="i i18 i-{{ c.icon }}"></span>{{ c.label }}
</button>
</sc-for>
<span style="flex: none; width: 1px; height: 32px; margin: 0 4px; background: #2b2b2b"></span>
<button type="button" class="hvc" style="flex: 1; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; border-radius: 4px; background: #232323; color: #ececec; font-size: 11px; font-weight: 600"><span class="i i18 i-undo"></span>되돌림</button>
</div>
<div style="display: flex; align-items: center; gap: 4px">
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
<button type="button" class="hvc" aria-expanded="{{ g.open }}" style="flex: 1; height: 26px; display: flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 4px; background: {{ g.bg }}; color: #ececec; font-size: 12px; font-weight: 600"><span class="i i14 i-{{ g.icon }}" style="color: {{ g.tint }}"></span>{{ g.name }}</button>
</sc-for>
<button type="button" class="hv" aria-label="다중 레이어 지우기 추가" title="다중 레이어 지우기 추가" style="flex: none; width: 26px; height: 26px; box-sizing: border-box; border: 1px dashed #6e6e6e; border-radius: 4px; background: transparent; color: #b4b4b4; display: inline-flex; align-items: center; justify-content: center"><span class="i i14 i-plus"></span></button>
</div>
</section>
<div role="menu" aria-label="예배 끝" style="position: absolute; left: 300px; top: 98px; width: 190px; padding: 6px; box-sizing: border-box; border-radius: 6px; background: #262626; box-shadow: 0 0 0 1px #3a3a3a, 0 8px 24px rgba(0, 0, 0, 0.5)">
<button type="button" role="menuitem" class="hvc" style="display: flex; align-items: center; width: 100%; height: 28px; padding: 0 8px; border: 0; border-radius: 4px; background: transparent; color: #ececec; font-size: 13px; text-align: left">실행</button>
<button type="button" role="menuitem" class="hvc" style="display: flex; align-items: center; width: 100%; height: 28px; padding: 0 8px; border: 0; border-radius: 4px; background: #333333; color: #ececec; font-size: 13px; text-align: left">다중 레이어 지우기 설정</button>
<div style="height: 1px; margin: 4px 2px; background: #3a3a3a"></div>
<button type="button" role="menuitem" class="hvc" style="display: flex; align-items: center; width: 100%; height: 28px; padding: 0 8px; border: 0; border-radius: 4px; background: transparent; color: #ececec; font-size: 13px; text-align: left">삭제</button>
</div>
</div>

<section role="dialog" aria-label="다중 레이어 지우기 설정" style="flex: none; width: 660px; height: 520px; display: flex; flex-direction: column; background: #1f1f1f; border-radius: 8px; box-shadow: 0 0 0 1px #3a3a3a, 0 16px 48px rgba(0, 0, 0, 0.6); overflow: hidden">
<div style="flex: none; height: 44px; box-sizing: border-box; display: flex; align-items: center; padding: 0 8px 0 16px; border-bottom: 1px solid #2b2b2b">
<span style="font-size: 13px; font-weight: 600">다중 레이어 지우기 설정</span>
<button type="button" class="hv" aria-label="닫기" title="닫기" style="margin-left: auto; width: 30px; height: 30px; border: 0; border-radius: 4px; background: transparent; color: #b4b4b4; display: inline-flex; align-items: center; justify-content: center"><span class="i i-x"></span></button>
</div>
<div style="flex: 1; min-height: 0; display: flex">
<div style="flex: none; width: 220px; display: flex; flex-direction: column; border-right: 1px solid #2b2b2b">
<div style="flex: none; height: 36px; display: flex; align-items: center; padding: 0 8px">
<button type="button" class="hv" aria-label="추가" title="추가" style="width: 26px; height: 26px; border: 0; border-radius: 4px; background: transparent; color: #b4b4b4; display: inline-flex; align-items: center; justify-content: center"><span class="i i-plus"></span></button>
</div>
<ul style="margin: 0; padding: 0 0 8px; list-style: none">
<sc-for list="{{ groupList }}" as="g" hint-placeholder-count="3">
<li><button type="button" class="hv" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 30px; padding: 0 14px; border: 0; background: {{ g.rowBg }}; color: #ececec; text-align: left; font-size: 13px"><span class="i i-{{ g.icon }}" style="color: {{ g.tint }}"></span><span style="flex: 1">{{ g.name }}</span><span style="font-size: 11px; color: {{ g.subColor }}">{{ g.sub }}</span></button></li>
</sc-for>
</ul>
</div>
<div style="flex: 1; min-width: 0; padding: 12px 18px 16px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 12px; height: 40px">
<span style="flex: 0 0 76px; font-size: 12px; color: #b4b4b4">이름</span>
<span style="flex: 1; display: flex; align-items: center; height: 30px; padding: 0 10px; border-radius: 4px; background: #121212; font-size: 13px">예배 끝</span>
</div>
<div style="display: flex; align-items: center; gap: 12px; height: 40px">
<span style="flex: 0 0 76px; font-size: 12px; color: #b4b4b4">아이콘</span>
<button type="button" class="hvc" style="display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px 0 10px; border: 0; border-radius: 4px; background: #2a2a2a; color: #ececec; font-size: 13px"><span class="i i-stop"></span><span class="i i12 i-down" style="color: #8c8c8c"></span></button>
</div>
<div style="display: flex; align-items: center; gap: 12px; height: 40px">
<span style="flex: 0 0 76px; font-size: 12px; color: #b4b4b4">색 입히기</span>
<span role="checkbox" aria-checked="true" style="flex: none; width: 16px; height: 16px; box-sizing: border-box; border-radius: 3px; background: #2a70dc; display: inline-flex; align-items: center; justify-content: center; color: #fff"><span class="i i12 i-check"></span></span>
<span role="radiogroup" aria-label="색" style="display: flex"><sc-for list="{{ tints }}" as="t" hint-placeholder-count="8"><span role="radio" class="hvc" aria-checked="{{ t.checked }}" aria-label="{{ t.name }}" title="{{ t.name }}" style="flex: none; width: 24px; height: 24px; box-sizing: border-box; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; box-shadow: {{ t.ring }}"><span style="width: 16px; height: 16px; border-radius: 3px; background: {{ t.color }}"></span></span></sc-for></span>
</div>
<div style="margin-top: 10px; padding-top: 14px; border-top: 1px solid #2b2b2b">
<p style="margin: 0 0 8px; font-size: 12px; font-weight: 600">지울 것</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 16px">
<sc-for list="{{ layers }}" as="y" hint-placeholder-count="8">
<div style="display: flex; align-items: center; gap: 10px; height: 30px">
<span role="checkbox" aria-checked="{{ y.checked }}" style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 3px; background: {{ y.boxBg }}; box-shadow: inset 0 0 0 1px {{ y.boxLine }}; display: inline-flex; align-items: center; justify-content: center; color: #fff"><sc-if value="{{ y.on }}" hint-placeholder-val="{{ true }}"><span class="i i12 i-check"></span></sc-if></span>
<span class="i i-{{ y.icon }}" style="color: {{ y.iconColor }}"></span>
<span style="flex: 1; color: {{ y.fg }}">{{ y.name }}</span>
</div>
</sc-for>
</div>
</div>
</div>
</div>
<div style="flex: none; height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-top: 1px solid #2b2b2b">
<button type="button" class="hv" style="height: 30px; padding: 0 14px; border: 0; border-radius: 4px; background: transparent; color: #b4b4b4; font-size: 13px">삭제</button>
<button type="button" style="margin-left: auto; height: 30px; padding: 0 14px; border: 0; border-radius: 4px; background: #2a70dc; color: #fff; font-size: 13px; font-weight: 600">완료</button>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1204,"height":552}}'>
class Component extends DCLogic {
renderVals() {
const pal = { green: '#8fbf7a', teal: '#5fb8c2', slate: '#7d8fd6', yellow: '#d6b35f', orange: '#d68f5f', rose: '#d07a8a', violet: '#a99ae0', gray: '#a3a3a3' };
const names = { green: '초록', teal: '청록', slate: '남색', yellow: '노랑', orange: '주황', rose: '분홍', violet: '보라', gray: '회색' };
const clear = (label, icon, active, flex) => ({ label: label, icon: icon, flex: flex || 1, bg: active ? '#2a2a2a' : '#1f1f1f', fg: active ? '#ececec' : '#6e6e6e' });
const layer = (icon, name, on) => ({ icon: icon, name: name, on: on, checked: on ? 'true' : 'false', boxBg: on ? '#2a70dc' : '#121212', boxLine: on ? 'transparent' : '#6e6e6e', fg: '#ececec', iconColor: '#b4b4b4' });
return {
clears: [clear('모두', 'layers', true, 1.4), clear('가사', 'text', true), clear('미디어', 'image', true), clear('소품', 'prop', true), clear('오디오', 'audio', false), clear('메시지', 'msg', true), clear('공지', 'notice', false)],
groups: [
{ name: '찬양 끝', icon: 'eraser', tint: pal.teal, bg: '#2a2a2a', open: 'false' },
{ name: '예배 끝', icon: 'stop', tint: pal.violet, bg: '#333333', open: 'true' }
],
groupList: [
{ name: '모두 지우기', icon: 'layers', tint: '#b4b4b4', sub: '기본', subColor: '#8c8c8c', rowBg: 'transparent' },
{ name: '찬양 끝', icon: 'eraser', tint: pal.teal, sub: '', subColor: '#8c8c8c', rowBg: 'transparent' },
{ name: '예배 끝', icon: 'stop', tint: pal.violet, sub: '', subColor: '#b4c6e0', rowBg: '#1f4170' }
],
tints: ['teal', 'green', 'yellow', 'orange', 'rose', 'violet', 'slate', 'gray'].map((k) => ({ name: names[k], color: pal[k], checked: k === 'violet' ? 'true' : 'false', ring: k === 'violet' ? 'inset 0 0 0 2px #ececec' : 'none' })),
layers: [
layer('text', '가사', true), layer('image', '배경 미디어', true),
layer('msg', '메시지', true), layer('notice', '공지', true),
layer('monitor', '무대 메시지', true), layer('prop', '소품', false),
layer('audio', '음악', false), layer('wave', '효과음', false)
]
};
}
}
</script>
</body>
</html>
