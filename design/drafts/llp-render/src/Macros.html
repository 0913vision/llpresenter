<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1780,"height":580}}'>

const act = (kind, value) => ({ kind: kind, value: value });
const mac = (name, icon, color, actions, extra) => Object.assign({
name: name, color: pal[color], actions: actions,
isSun: icon === 'sun', isSong: icon === 'song', isMic: icon === 'mic', isNotice: icon === 'notice', isCoins: icon === 'coins', isFilm: icon === 'film', isPray: icon === 'pray', isStop: icon === 'stop',
hasClock: false, isLast: false, state: 'idle', fg: '#b4b4b4', weight: 400
}, extra || {});

const swatchNames = { green: '초록', teal: '청록', slate: '남색', yellow: '노랑', orange: '주황', rose: '분홍', violet: '보라', gray: '회색' };
const group = (title, items) => ({ title: title, items: items.map((p) => ({ icon: p[0], label: p[1] })) });
const macros = [
mac('예배 시작', 'sun', 'green', [act('Look', '평상시'), act('지우기', '카운트다운'), act('오디오', '페이드 아웃'), act('타이머', '예배 경과')], { hasClock: true }),
mac('찬양', 'song', 'teal', [act('Look', '평상시'), act('배경', '따뜻한 빛')], last),
mac('말씀', 'mic', 'slate', [act('Look', '설교'), act('소품', '설교 본문 자막'), act('타이머', '설교')]),

mac('헌금', 'coins', 'orange', [act('오디오', '헌금 연주'), act('소품', '온라인 헌금 안내')]),

mac('축도', 'pray', 'violet', [act('지우기', '모두'), act('소품', '로고')]),
mac('예배 끝', 'stop', 'gray', [act('오디오', '축도 후 연주'), act('소품', '로고')])
