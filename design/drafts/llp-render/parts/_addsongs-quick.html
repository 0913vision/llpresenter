<div role="dialog" aria-label="항목 추가" style="position: absolute; z-index: 20; left: 246px; top: 34px; width: 360px; padding: 8px; box-sizing: border-box; border-radius: 6px; background: #262626; box-shadow: 0 0 0 1px #3a3a3a, 0 8px 24px rgba(0, 0, 0, 0.5)">
<span style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 4px; background: #121212; box-shadow: inset 0 0 0 1px #3d8bf0; color: #8c8c8c"><span class="i i-search"></span><input aria-label="곡이나 항목 찾기" value="주" placeholder="곡, 가사, 초성" style="flex: 1; min-width: 0; height: 28px; padding: 0; border: 0; background: transparent; color: #ececec; font-size: 13px"></span>
<p style="margin: 0; padding: 10px 8px 4px; font-size: 11px; line-height: 14px; font-weight: 600; color: #8c8c8c">라이브러리</p>
<sc-for list="{{ quick.songs }}" as="s" hint-placeholder-count="5">
<div role="option" aria-selected="{{ s.selected }}" class="hv" style="display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 8px; border-radius: 4px; background: {{ s.bg }}">
<span class="i i-song" style="color: #b4b4b4"></span>
<span style="flex: 1; min-width: 0; font-size: 13px; color: #cfcfcf; overflow: hidden; white-space: nowrap; text-overflow: ellipsis"><span>{{ s.pre }}</span><span style="font-weight: 700; color: #ececec">{{ s.match }}</span><span>{{ s.post }}</span></span>
<span style="font-size: 11px; color: #8c8c8c; font-variant-numeric: tabular-nums">{{ s.count }}</span>
</div>
</sc-for>
<div style="height: 1px; margin: 6px 2px; background: #3a3a3a"></div>
<p style="margin: 0; padding: 2px 8px 4px; font-size: 11px; line-height: 14px; font-weight: 600; color: #8c8c8c">다른 항목</p>
<sc-for list="{{ quick.kinds }}" as="k" hint-placeholder-count="5">
<div role="option" aria-selected="false" class="hv" style="display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 8px; border-radius: 4px; font-size: 13px; color: #ececec">
<span class="i i-{{ k.icon }}" style="color: #b4b4b4"></span>
<span style="flex: 1">{{ k.label }}</span>
</div>
</sc-for>
</div>
