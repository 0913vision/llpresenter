<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<section style="flex: 1; min-height: 0; display: flex; flex-direction: column; background: #1c1c1c; border-radius: 5px; overflow: hidden" aria-label="성경">
<div style="flex: none; height: 34px; box-sizing: border-box; display: flex; align-items: center; padding: 0 8px 0 14px; border-bottom: 1px solid #2b2b2b">
<span style="display: flex; align-items: baseline; gap: 10px"><span style="font-size: 13px; font-weight: 600">{{ bible.title }}</span><span style="font-size: 12px; color: #8c8c8c; font-variant-numeric: tabular-nums">{{ bible.count }}</span></span>
<span style="margin-left: 12px; display: inline-flex; align-items: center; gap: 6px; height: 20px; padding: 0 7px; border-radius: 3px; background: #262626; color: #b4b4b4; font-size: 11px"><span class="i i12 i-book"></span>성경</span>
<span style="margin-left: auto; display: flex; align-items: center; gap: 8px">
<button type="button" class="hvc" style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 6px 0 8px; border: 0; border-radius: 4px; background: #2a2a2a; color: #ececec; font-size: 12px"><span class="i i14 i-translate" style="color: #b4b4b4"></span>개역한글<span class="i i12 i-down" style="margin-left: 2px; color: #8c8c8c"></span></button>
<button type="button" class="hv" aria-label="역본 추가" title="역본 추가" style="width: 26px; height: 26px; border: 0; border-radius: 4px; background: transparent; color: #b4b4b4; display: inline-flex; align-items: center; justify-content: center"><span class="i i-plus"></span></button>
</span>
</div>

<div style="flex: none; height: 44px; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 1px solid #2b2b2b">
<span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 12px; color: #b4b4b4">나누기</span><span style="display: flex; padding: 2px; border-radius: 5px; background: #121212"><sc-for list="{{ bible.split }}" as="o" hint-placeholder-count="3"><button type="button" style="height: 22px; padding: 0 10px; border: 0; border-radius: 3px; background: {{ o.bg }}; color: {{ o.fg }}; font-size: 12px">{{ o.label }}</button></sc-for></span></span>
<span style="width: 1px; height: 16px; background: #2b2b2b"></span>
<span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 12px; color: #b4b4b4">참조</span><button type="button" class="hvc" style="display: inline-flex; align-items: center; gap: 8px; height: 26px; padding: 0 6px 0 8px; border: 0; border-radius: 4px; background: #2a2a2a; color: #ececec; font-size: 12px">장마다<span class="i i12 i-down" style="color: #8c8c8c"></span></button></span>
<span style="width: 1px; height: 16px; background: #2b2b2b"></span>
<sc-for list="{{ bible.toggles }}" as="t" hint-placeholder-count="2"><span style="display: inline-flex; align-items: center; gap: 10px; font-size: 12px; color: #b4b4b4"><span role="switch" aria-checked="{{ t.checked }}" style="position: relative; flex: none; width: 30px; height: 18px; border-radius: 9px; background: {{ t.track }}"><span style="position: absolute; top: 2px; left: {{ t.knob }}; width: 14px; height: 14px; border-radius: 50%; background: #ececec"></span></span>{{ t.label }}</span></sc-for>
</div>

<div style="flex: none; padding: 14px">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 12px">
<sc-for list="{{ bible.slides }}" as="s" hint-placeholder-count="3">
<button type="button" class="th" data-state="{{ s.state }}" style="display: flex; flex-direction: column; padding: 0; border: 0; border-radius: 4px; background: transparent; overflow: hidden; text-align: left; color: inherit">
<span style="position: relative; display: flex; align-items: center; justify-content: center; aspect-ratio: 16 / 9; width: 100%; box-sizing: border-box; padding: 0 9% 12px; background: #000; color: #fff; font-size: 13px; line-height: 1.55; font-weight: 700; text-align: center"><span><span style="margin-right: 3px; font-size: 9px; vertical-align: 4px; color: #b4b4b4">{{ s.num }}</span>{{ s.text }}</span><span style="position: absolute; right: 10px; bottom: 8px; font-size: 10px; font-weight: 600; color: #b4b4b4">{{ s.full }}</span></span>
<span style="display: flex; align-items: center; gap: 8px; height: 24px; padding: 0 8px; background: #2a2a2a; color: #b4b4b4; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden"><span style="font-variant-numeric: tabular-nums">{{ s.n }}</span><span style="font-variant-numeric: tabular-nums">{{ s.ref }}</span></span>
</button>
</sc-for>
</div>
</div>

<div style="flex: none; padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px; height: 20px"><span style="font-size: 12px; font-weight: 600">화면별 보기</span><span style="font-size: 12px; color: #8c8c8c; font-variant-numeric: tabular-nums">1 / 3</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="position: relative; aspect-ratio: 16 / 9; border-radius: 4px; overflow: hidden; background: #000; box-shadow: 0 0 0 1px #2b2b2b">
<img src="/_blob/18a41d6fa76a5bf859efd17846f95d68" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.5">
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 9%; color: #fff; text-align: center; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6)">
<p style="margin: 0; font-size: 20px; line-height: 31px; font-weight: 700"><span style="margin-right: 4px; font-size: 12px; vertical-align: 6px; color: #d6d6d6">16</span>{{ bible.current }}</p>
<p style="margin: 0; font-size: 13px; line-height: 18px; font-weight: 600; color: #e6e6e6">요한복음 3:16</p>
</div>
</div>
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px"><span style="font-weight: 600">본 화면</span><span style="color: #8c8c8c">모니터 2</span><span style="margin-left: auto; color: #8c8c8c">말씀</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="position: relative; aspect-ratio: 16 / 9; border-radius: 4px; overflow: hidden; background: #00b140; box-shadow: 0 0 0 1px #2b2b2b">
<div style="position: absolute; left: 8%; right: 8%; bottom: 8%; display: flex; flex-direction: column; gap: 4px; padding: 10px 16px; background: rgba(0, 0, 0, 0.82); color: #fff">
<p style="margin: 0; font-size: 13px; line-height: 20px; font-weight: 600">{{ bible.current }}</p>
<p style="margin: 0; font-size: 11px; line-height: 14px; font-weight: 600; color: #cfcfcf; text-align: right">요한복음 3:16</p>
</div>
</div>
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px"><span style="font-weight: 600">방송 자막</span><span style="color: #8c8c8c">NDI</span><span style="margin-left: auto; color: #8c8c8c">하단 자막</span></div>
</div>
</div>
</div>

<div style="margin-top: auto; flex: none; height: 52px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-top: 1px solid #2b2b2b">
<button type="button" class="hvc" style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 8px; border: 0; border-radius: 4px; background: #2a2a2a; color: #ececec; font-size: 12px"><span class="i i14 i-prev"></span>앞 절 추가</button>
<button type="button" class="hvc" style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 8px; border: 0; border-radius: 4px; background: #2a2a2a; color: #ececec; font-size: 12px"><span class="i i14 i-next"></span>뒤 절 추가</button>
<button type="button" class="hvc" style="margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 8px; border: 0; border-radius: 4px; background: #2a2a2a; color: #ececec; font-size: 12px"><span class="i i14 i-listplus"></span>예배 순서에 넣기</button>
<button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 8px; border: 0; border-radius: 4px; background: #2a70dc; color: #fff; font-size: 12px; font-weight: 600"><span class="i i14 i-playf"></span>바로 띄우기</button>
</div>
</section>
</div>
