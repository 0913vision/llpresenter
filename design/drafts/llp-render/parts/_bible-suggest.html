<div role="listbox" aria-label="구절 제안" style="position: absolute; z-index: 20; left: 0; bottom: 228px; width: 312px; padding: 6px; box-sizing: border-box; border-radius: 6px; background: #262626; box-shadow: 0 0 0 1px #3a3a3a, 0 8px 24px rgba(0, 0, 0, 0.5)">
<p style="margin: 0; padding: 2px 8px 4px; font-size: 11px; line-height: 14px; font-weight: 600; color: #8c8c8c">구절</p>
<sc-for list="{{ bible.suggest }}" as="g" hint-placeholder-count="3">
<div role="option" aria-selected="{{ g.selected }}" style="display: flex; align-items: center; gap: 10px; height: 28px; padding: 0 8px; border-radius: 4px; background: {{ g.bg }}">
<span class="i i14 i-book" style="color: #b4b4b4"></span>
<span style="flex: 1; min-width: 0; font-size: 13px; white-space: nowrap"><span style="font-weight: 700; color: #ececec">{{ g.match }}</span><span style="color: #ececec">{{ g.rest }}</span><span style="margin-left: 8px; color: #ececec; font-variant-numeric: tabular-nums">{{ g.range }}</span></span>
<span style="font-size: 11px; color: #8c8c8c">{{ g.note }}</span>
</div>
</sc-for>
<div style="height: 1px; margin: 4px 2px; background: #3a3a3a"></div>
<p style="margin: 0; padding: 6px 8px 4px; font-size: 11px; line-height: 14px; font-weight: 600; color: #8c8c8c">최근</p>
<sc-for list="{{ bible.recent }}" as="r" hint-placeholder-count="2">
<div role="option" aria-selected="false" class="hvc" style="display: flex; align-items: center; gap: 10px; height: 28px; padding: 0 8px; border-radius: 4px">
<span class="i i14 i-history" style="color: #b4b4b4"></span>
<span style="flex: 1; min-width: 0; font-size: 13px; color: #ececec; white-space: nowrap">{{ r.book }}<span style="margin-left: 8px; font-variant-numeric: tabular-nums">{{ r.range }}</span></span>
</div>
</sc-for>
</div>
