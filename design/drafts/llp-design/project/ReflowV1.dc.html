<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
const labelColor = (label) => {
if (!label) return null;
if (/절$/.test(label)) return '#5fb8c2';
if (label === '프리코러스') return '#a5bd72';
if (label === '후렴') return '#d6a35f';
if (label === '브릿지') return '#b39ce3';
return '#b3ada6';
};
const lyrics = [
'만복의 근원 하나님\n온 백성 찬송 드리고',
'저 천사여 찬송하세\n찬송 성부 성자 성령',
'찬송 성부 성자 성령\n아멘',
'찬송 성부 성자 성령\n만복의 근원 하나님'
];
const labels = ['1절', '프리코러스', '후렴', ''];
const current = 3;
let n = 0;
const lines = [];
lyrics.forEach((text, i) => {
const band = i === current ? '#1b2230' : 'transparent';
if (labels[i]) lines.push({ n: ++n, isLabel: true, isText: false, text: labels[i], labelBg: labelColor(labels[i]), bg: band, caret: false });
const rows = text.split('\n');
rows.forEach((row, r) => lines.push({ n: ++n, isLabel: false, isText: true, text: row, bg: band, caret: i === current && r === rows.length - 1 }));
if (i < lyrics.length - 1) lines.push({ n: ++n, isLabel: false, isText: true, text: '', bg: 'transparent', caret: false });
});
const slides = lyrics.map((text, i) => {
const color = labelColor(labels[i]);
return {
n: i + 1, text: text, label: labels[i] || '이름표 없음',
barBg: color || '#2a2a2a', barFg: color ? '#101010' : '#8c8c8c',
ring: i === current ? '#3d8bf0' : '#2b2b2b', ringW: i === current ? '2px' : '1px'
};
});
const item = (title, meta, kind, state) => {
const s = state || 'idle';
return {
isHeader: false, isItem: true, title: title, meta: meta,
isSong: kind === 'song', isFilm: kind === 'film', isNotice: kind === 'notice', isBook: kind === 'book', isSlides: kind === 'slides',
bg: s === 'sel' ? '#1f4170' : 'transparent',
fg: '#ececec',
iconColor: s === 'sel' ? '#ececec' : '#b4b4b4',
metaColor: s === 'sel' ? '#c7d9f3' : '#8c8c8c',
drop: s === 'drop' ? 'inset 0 2px 0 #3d8bf0' : 'none'
};
};
const header = (label) => ({ isHeader: true, isItem: false, label: label });
const song = (title, meta) => ({ title: title, meta: meta });
