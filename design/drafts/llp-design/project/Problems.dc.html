<sc-if value="{{ c.isNotice }}" hint-placeholder-val="{{ false }}"><span class="i i18 i-notice"></span></sc-if>
</span>
<span>{{ c.label }}</span>
</button>
</sc-for>
<span style="flex: none; width: 1px; height: 32px; margin: 0 4px; background: #2b2b2b"></span>
<button type="button" class="hvc" aria-label="되돌리기" style="flex: 1; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; border-radius: 4px; background: #232323; color: #ececec; font-size: 11px; font-weight: 600"><span class="i i18 i-undo"></span>되돌림</button>
</section>

<section style="flex: 1; min-height: 0; display: flex; flex-direction: column; background: #1c1c1c; border-radius: 5px; overflow: hidden" aria-label="진행 도구">
<div style="flex: none; height: 34px; box-sizing: border-box; display: flex; align-items: stretch; gap: 18px; padding: 0 8px 0 14px; border-bottom: 1px solid #2b2b2b">
<sc-for list="{{ ctrlTabs }}" as="t" hint-placeholder-count="8"><span style="display: inline-flex; align-items: center; gap: 6px; padding: 0 1px; border-bottom: 2px solid {{ t.line }}; color: {{ t.fg }}; font-size: 12px; font-weight: {{ t.weight }}">{{ t.label }}<sc-if value="{{ t.hasCount }}" hint-placeholder-val="{{ false }}"><span style="min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 3px; background: #1f4170; color: #b4c6e0; font-size: 11px; line-height: 18px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums">{{ t.count }}</span></sc-if></span></sc-for>
</div>
<ul style="margin: 0; padding: 4px 0; list-style: none">
<sc-for list="{{ overlays }}" as="o" hint-placeholder-count="4">
<li style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 8px 0 14px">
<span style="display: inline-flex; color: #b4b4b4">
<sc-if value="{{ o.isMedia }}" hint-placeholder-val="{{ false }}"><span class="i i-image"></span></sc-if>
<sc-if value="{{ o.isMsg }}" hint-placeholder-val="{{ true }}"><span class="i i-msg"></span></sc-if>
<sc-if value="{{ o.isProp }}" hint-placeholder-val="{{ false }}"><span class="i i-prop"></span></sc-if>
<sc-if value="{{ o.isStageMsg }}" hint-placeholder-val="{{ false }}"><span class="i i-monitor"></span></sc-if>
</span>
<span style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-size: 12px; overflow: hidden; white-space: nowrap"><span style="overflow: hidden; text-overflow: ellipsis">{{ o.title }}</span><sc-if value="{{ o.isFrozen }}" hint-placeholder-val="{{ false }}"><span class="i i14 i-pause" title="배경 영상 파일을 찾을 수 없어 정지 화면으로 표시 중" style="color: #e3a23b"></span></sc-if></span>
<span style="display: flex; gap: 4px"><span style="height: 18px; padding: 0 6px; border-radius: 3px; background: #2a2a2a; color: #b4b4b4; font-size: 11px; line-height: 18px">{{ o.target }}</span></span>
<span style="width: 36px; text-align: right; font-size: 11px; color: #8c8c8c; font-variant-numeric: tabular-nums">{{ o.time }}</span>
<button type="button" class="hv" aria-label="내리기" title="내리기" style="width: 26px; height: 26px; border: 0; border-radius: 4px; background: transparent; color: #b4b4b4; display: inline-flex; align-items: center; justify-content: center"><span class="i i-x"></span></button>
</li>
</sc-for>
</ul>
</section>

</div>
</div>

<footer style="flex: none; height: 28px; display: flex; align-items: center; gap: 18px; padding: 0 18px; font-size: 11px; color: #8c8c8c">
<span style="display: inline-flex; align-items: center; gap: 6px"><span class="i i14 i-saved"></span>11:24 저장됨</span>
<span style="margin-left: auto; display: inline-flex; align-items: center; gap: 6px"><span style="width: 6px; height: 6px; border-radius: 50%; background: #3dbb6b"></span>본 화면 60fps</span>
<span style="display: inline-flex; align-items: center; gap: 6px; color: #e3a23b"><span style="width: 6px; height: 6px; border-radius: 50%; background: #e3a23b"></span>무대 화면 창으로 표시 중</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 6px; height: 6px; border-radius: 50%; background: #3dbb6b"></span>방송 자막 60fps</span>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
const lyrics = [
'만복의 근원 하나님\n온 백성 찬송 드리고',
'저 천사여 찬송하세\n찬송 성부 성자 성령',
'찬송 성부 성자 성령\n아멘',
'찬송 성부 성자 성령\n만복의 근원 하나님'
];
const labels = [['1절', '#5fb8c2'], ['프리코러스', '#8fbf7a'], ['후렴', '#d6b35f'], ['', null]];
const seq = [0, 1, 2, 3, 1, 2, 3, 2, 3];
const live = 1;
const slides = seq.map((k, i) => ({
n: i + 1, text: lyrics[k], label: labels[k][0],
barBg: labels[k][1] || '#2a2a2a', barFg: labels[k][1] ? '#101010' : '#a3a3a3',
state: i === live ? 'live' : 'idle'
}));
const out = (label, kind, state, name, target) => ({
label: label, isCapture: kind === 'capture', isMonitor: kind !== 'capture',
dot: state === 'warn' ? '#e3a23b' : '#d2343a', iconFg: state === 'warn' ? '#e3a23b' : '#ececec',
title: state === 'warn' ? name + ': ' + target + '을 찾을 수 없습니다' : name + ' 출력 끄기 (' + target + ')'
});
const item = (title, kind, state, warn) => {
const s = state || 'idle';
return {
isHeader: false, isItem: true, title: title, isWarn: !!warn,
isLive: s === 'live', isSong: kind === 'song', isFilm: kind === 'film', isNotice: kind === 'notice', isBook: kind === 'book', isSlides: kind === 'slides',
bg: s === 'live' ? '#1f4170' : 'transparent', fg: s === 'done' ? '#8c8c8c' : '#ececec',
iconColor: s === 'live' ? '#ececec' : (s === 'done' ? '#6e6e6e' : '#b4b4b4')
};
};
const header = (label) => ({ isHeader: true, isItem: false, label: label });
const clearDef = [['all', '모두', 1.4, true], ['slide', '가사', 1, true], ['media', '미디어', 1, true], ['prop', '소품', 1, true], ['audio', '오디오', 1, false], ['msg', '메시지', 1, true], ['notice', '공지', 1, false]];
const m = (name, src, dur, isLive, missing) => ({ name: name, src: src, dur: dur, ok: !missing, missing: !!missing, ring: isLive ? '#d2343a' : 'transparent', fg: isLive ? '#ececec' : '#b4b4b4', title: missing ? '파일을 찾을 수 없습니다: D:\\예배 미디어\\배경\\' + name + '.mp4' : name });
const ov = (kind, title, target, time, frozen) => ({ isMedia: kind === 'media', isMsg: kind === 'msg', isProp: kind === 'prop', isStageMsg: kind === 'stage', title: title, target: target, time: time || '', isFrozen: !!frozen });
const ctrlDef = ['표시 중', '오디오', '무대', '타이머', '메시지', '공지', '소품', '매크로'];
return {
liveText: lyrics[seq[live]],
thumbFont: ((1116 - 3 * 12) / 4 * 0.044).toFixed(1) + 'px',
outs: [out('본 화면', 'monitor', 'ok', '본 화면', '모니터 2'), out('무대', 'monitor', 'warn', '무대 화면', '모니터 3'), out('방송 자막', 'capture', 'ok', '방송 자막', 'NDI')],
slides: slides,
playlist: [
header('예배 전'), item('예배 전 카운트다운', 'film', 'done'), item('주일 광고', 'notice', 'done'),
header('찬양'), item('이 세상 험하고', 'song', 'done'), item('만복의 근원 하나님', 'song', 'live', true), item('내 주를 가까이 하게 함은', 'song'),
header('말씀'), item('요한복음 3장 16절', 'book'), item('설교', 'slides'),
header('마무리'), item('주 하나님 지으신 모든 세계', 'song'), item('축도', 'notice')
],
quick: [
['요한복음 3장 16절', 'book', false], ['주 하나님 지으신 모든 세계', 'song', false], ['검은 화면', 'black', false],
['로고 화면', 'logo', true], ['시작 카운트다운', 'timer', false], ['축도', 'slide', false]
].map((q) => ({
name: q[0], isBook: q[1] === 'book', isSong: q[1] === 'song', isBlack: q[1] === 'black', isLogo: q[1] === 'logo', isTimer: q[1] === 'timer', isSlide: q[1] === 'slide',
bg: q[2] ? '#333333' : 'transparent', fg: '#ececec', iconColor: q[2] ? '#ececec' : '#b4b4b4', bar: q[2] ? '#d2343a' : 'transparent'
})),
media: [
m('따뜻한 빛', '', '0:30', true, true),
m('푸른 빛줄기', '/_blob/85c85c8365a93673f8757a855a5ae71e', '0:45', false),
m('새벽 하늘', '/_blob/18a41d6fa76a5bf859efd17846f95d68', '1:00', false),
m('물결', '/_blob/2d2d8c67d2ffaa44a487a3a2155fce60', '0:40', false),
m('별빛', '/_blob/e03760b0e6da8968216000a548f05339', '0:30', false),
m('새벽 능선', '/_blob/a26fea38dfbc6c6a6ebbe467c651a3bf', '1:20', false)
],
clears: clearDef.map((c) => ({
label: c[1], flex: c[2], isAll: c[0] === 'all', isSlide: c[0] === 'slide', isMedia: c[0] === 'media', isProp: c[0] === 'prop', isAudio: c[0] === 'audio', isMsg: c[0] === 'msg', isNotice: c[0] === 'notice',
bg: c[3] ? '#2a2a2a' : '#1f1f1f', fg: c[3] ? '#ececec' : '#6e6e6e'
})),
ctrlTabs: ctrlDef.map((t, i) => ({ label: t, line: i === 0 ? '#ececec' : 'transparent', fg: i === 0 ? '#ececec' : '#8c8c8c', weight: 600, hasCount: i === 0, count: '4' })),
overlays: [
ov('media', '따뜻한 빛', '본 화면', '', true),
ov('msg', '12가 3456 차량 이동 부탁드립니다', '본 화면', '0:42'),
ov('stage', '후렴 한 번 더', '무대', ''),
ov('prop', '로고', '본 화면', '')
]
};
}
}
</script>
</body>
</html>
