<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>이름표와 색 고르기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Pretendard Variable";src:url("/_blob/44ae4219c075570535882b3a34ea3567") format("woff2");font-weight:45 920;font-display:swap}
body{margin:0;background:#0e0e0e}
a{color:#7fb0f0}a:hover{color:#a8c9f5}
button,input{font:inherit;cursor:default}
.hv:hover{background:#2f2f2f}
.hvc:hover{filter:brightness(1.08)}
.i{display:inline-block;flex:none;width:16px;height:16px;background-color:currentColor;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain}
.i14{width:14px;height:14px}
.i-check{-webkit-mask-image:url("/_blob/9a89a2bff58b8395511703929514cb66");mask-image:url("/_blob/9a89a2bff58b8395511703929514cb66")}
.i-down{-webkit-mask-image:url("/_blob/fdede3cf9294bdfffe2831e4985b91ba");mask-image:url("/_blob/fdede3cf9294bdfffe2831e4985b91ba")}
.i-plus{-webkit-mask-image:url("/_blob/60593869febedd0f7cc96739b15ff702");mask-image:url("/_blob/60593869febedd0f7cc96739b15ff702")}
.i-x{-webkit-mask-image:url("/_blob/20ff3492ea768cacd467480e386ad17b");mask-image:url("/_blob/20ff3492ea768cacd467480e386ad17b")}
</style>
</helmet>
<div style="width: 820px; height: 720px; box-sizing: border-box; padding: 18px; background: #0e0e0e; color: #ececec; font-family: 'Pretendard Variable', Pretendard, sans-serif; font-size: 13px; line-height: 18px; word-break: keep-all; -webkit-font-smoothing: antialiased">

<section style="position: relative; height: 100%; display: flex; flex-direction: column; background: #1c1c1c; border-radius: 5px" aria-label="장 미리보기">
<div style="flex: none; height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid #2b2b2b">
<span style="font-size: 12px; font-weight: 600; line-height: 32px; border-bottom: 2px solid #ececec">장</span>
<span style="font-size: 11px; color: #8c8c8c; font-variant-numeric: tabular-nums">4</span>
</div>
<div style="padding: 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px">
<sc-for list="{{ slides }}" as="s" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; border-radius: 4px; overflow: hidden; box-shadow: 0 0 0 {{ s.ringW }} {{ s.ring }}">
<span style="position: relative; display: block; aspect-ratio: 16 / 9; background: #000; overflow: hidden">
<img src="/_blob/e96d6204449f1e44237721b22d7463c9" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 10%; color: #fff; font-size: 14px; line-height: 1.45; font-weight: 700; text-align: center; white-space: pre-line; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6)">{{ s.text }}</span>
</span>
<button type="button" class="hvc" style="display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 8px; border: 0; background: {{ s.barBg }}; color: {{ s.barFg }}; font-size: 12px; font-weight: 700; text-align: left">
<span style="font-variant-numeric: tabular-nums">{{ s.n }}</span>
<span style="flex: 1">{{ s.label }}</span>
<span class="i i14 i-down" style="opacity: 0.65"></span>
</button>
</div>
</sc-for>
</div>

<div role="menu" aria-label="이름표" style="position: absolute; left: 140px; top: 120px; width: 300px; padding: 6px; box-sizing: border-box; border-radius: 6px; background: #262626; box-shadow: 0 0 0 1px #3a3a3a, 0 8px 24px rgba(0, 0, 0, 0.5)">
<sc-for list="{{ menu }}" as="m" hint-placeholder-count="9">
<button type="button" role="menuitemradio" aria-checked="{{ m.checked }}" class="hv" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 30px; padding: 0 8px; border: 0; border-radius: 4px; background: {{ m.bg }}; color: #ececec; font-size: 13px; text-align: left">
<span style="width: 18px; height: 12px; border-radius: 2px; background: {{ m.swatch }}; box-shadow: inset 0 0 0 1px {{ m.swatchLine }}" aria-hidden="true"></span>
<span style="flex: 1; color: {{ m.fg }}">{{ m.name }}</span>
<span style="min-width: 18px; font-size: 11px; color: #8c8c8c; text-align: center">{{ m.key }}</span>
<span style="width: 14px; display: inline-flex"><sc-if value="{{ m.isChecked }}" hint-placeholder-val="{{ false }}"><span class="i i14 i-check"></span></sc-if></span>
</button>
</sc-for>
<div style="height: 1px; margin: 6px 2px; background: #3a3a3a"></div>
<div style="display: flex; align-items: center; gap: 6px; padding: 4px 8px 6px" role="radiogroup" aria-label="후렴 색">
<span style="width: 30px; font-size: 12px; color: #b4b4b4">색</span>
<sc-for list="{{ swatches }}" as="w" hint-placeholder-count="9">
<button type="button" role="radio" aria-checked="{{ w.checked }}" aria-label="{{ w.name }}" style="width: 24px; height: 24px; padding: 0; border: 0; border-radius: 4px; background: transparent; box-shadow: 0 0 0 2px {{ w.ring }}; display: inline-flex; align-items: center; justify-content: center"><span style="width: 18px; height: 18px; border-radius: 3px; background: {{ w.color }}; box-shadow: inset 0 0 0 1px {{ w.line }}; display: inline-flex; align-items: center; justify-content: center; color: #6e6e6e"><sc-if value="{{ w.isNone }}" hint-placeholder-val="{{ false }}"><span class="i i14 i-x"></span></sc-if></span></button>
</sc-for>
</div>
<div style="height: 1px; margin: 4px 2px 6px; background: #3a3a3a"></div>
<button type="button" class="hv" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 30px; padding: 0 8px; border: 0; border-radius: 4px; background: transparent; color: #b4b4b4; font-size: 13px; text-align: left"><span class="i i14 i-plus"></span>새 이름표</button>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":720}}'>
class Component extends DCLogic {
renderVals() {
const palette = {
none: { color: '#2a2a2a', name: '없음' },
teal: { color: '#5fb8c2', name: '청록' },
green: { color: '#8fbf7a', name: '초록' },
yellow: { color: '#d6b35f', name: '노랑' },
orange: { color: '#d68f5f', name: '주황' },
rose: { color: '#d07a8a', name: '분홍' },
violet: { color: '#a99ae0', name: '보라' },
slate: { color: '#7d8fd6', name: '남색' },
gray: { color: '#a3a3a3', name: '회색' }
};
const swatchOrder = ['none', 'teal', 'green', 'yellow', 'orange', 'rose', 'violet', 'slate', 'gray'];
const presetDefs = [
['1절', 'teal', '1'], ['2절', 'teal', '2'], ['3절', 'teal', '3'], ['프리코러스', 'green', 'P'],
['후렴', 'yellow', 'C'], ['브릿지', 'violet', 'B'], ['간주', 'gray', 'I'], ['엔딩', 'none', 'E']
];
const current = '후렴';
const line = (key) => (key === 'none' ? '#4a4a4a' : 'transparent');
const menu = [{ name: '이름표 없음', key: '', swatch: 'transparent', swatchLine: '#4a4a4a', fg: '#b4b4b4', isChecked: false, checked: 'false', bg: 'transparent' }]
.concat(presetDefs.map((p) => ({
name: p[0], key: p[2], swatch: palette[p[1]].color, swatchLine: line(p[1]), fg: '#ececec',
isChecked: p[0] === current, checked: p[0] === current ? 'true' : 'false',
bg: p[0] === current ? '#333333' : 'transparent'
})));
const swatches = swatchOrder.map((k) => ({
name: palette[k].name, color: palette[k].color, line: line(k), isNone: k === 'none',
checked: k === 'yellow' ? 'true' : 'false', ring: k === 'yellow' ? '#ececec' : 'transparent'
}));
const lyrics = [
'만복의 근원 하나님\n온 백성 찬송 드리고',
'저 천사여 찬송하세\n찬송 성부 성자 성령',
'찬송 성부 성자 성령\n아멘',
'찬송 성부 성자 성령\n만복의 근원 하나님'
];
const labelDefs = [['1절', 'teal'], ['프리코러스', 'green'], ['후렴', 'yellow'], ['', 'none']];
const slides = lyrics.map((text, i) => {
const has = !!labelDefs[i][0];
const colorKey = has ? labelDefs[i][1] : 'none';
const colored = colorKey !== 'none';
return {
n: i + 1, text: text, label: has ? labelDefs[i][0] : '',
barBg: palette[colorKey].color, barFg: colored ? '#101010' : '#a3a3a3',
ring: i === 2 ? '#3d8bf0' : '#2b2b2b', ringW: i === 2 ? '2px' : '1px'
};
});
return { menu: menu, swatches: swatches, slides: slides };
}
}
</script>
</body>
</html>
