<section style="flex: 1; min-width: 0; display: flex; flex-direction: column; background: #1c1c1c; border-radius: 5px; overflow: hidden" aria-label="소품">
<div style="flex: none; height: 34px; display: flex; align-items: center; padding: 0 8px 0 12px; border-bottom: 1px solid #2b2b2b">
<span style="font-size: 12px; font-weight: 600; line-height: 32px; border-bottom: 2px solid #ececec">소품</span>
<button type="button" class="hv" aria-label="소품 추가" style="margin-left: auto; width: 26px; height: 26px; border: 0; border-radius: 4px; background: transparent; color: #b4b4b4; display: inline-flex; align-items: center; justify-content: center"><span class="i i-plus"></span></button>
</div>
<ul style="margin: 0; padding: 8px 0; list-style: none">
<sc-for list="{{ props }}" as="p" hint-placeholder-count="4">
<li style="display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: {{ p.bg }}">
<span class="i i14 i-grip" style="color: #5c5c5c"></span>
<span style="position: relative; flex: 0 0 112px; aspect-ratio: 16 / 9; border-radius: 3px; overflow: hidden; background: #000; box-shadow: 0 0 0 1px #2b2b2b">
<sc-if value="{{ p.isLogo }}" hint-placeholder-val="{{ true }}"><span style="position: absolute; right: 7px; top: 6px; font-size: 6px; font-weight: 700; letter-spacing: 0.06em; color: rgba(255, 255, 255, 0.75)">LOVELIGHT</span></sc-if>
<sc-if value="{{ p.isLower }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 8px; bottom: 9px; display: flex; flex-direction: column; gap: 1px; padding: 3px 6px; border-left: 2px solid #ececec; background: rgba(0, 0, 0, 0.75)"><span style="font-size: 6px; font-weight: 700; color: #fff">요한복음 3장 16절</span><span style="font-size: 4px; color: #c9c9c9">설교 본문</span></span></sc-if>
<sc-if value="{{ p.isTimer }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums">04:32</span></sc-if>
<sc-if value="{{ p.isQr }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 8px; bottom: 8px; width: 18px; height: 18px; background-color: #fff; background-image: repeating-linear-gradient(90deg, #000 0 2px, #fff 2px 4px), repeating-linear-gradient(0deg, #000 0 2px, transparent 2px 4px); background-blend-mode: multiply"></span><span style="position: absolute; left: 8px; bottom: 10px; font-size: 6px; font-weight: 600; color: #fff">온라인 헌금</span></sc-if>
</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600">{{ p.name }}</span>
<span style="display: flex; gap: 4px; flex-wrap: wrap">
<sc-for list="{{ p.targets }}" as="tg" hint-placeholder-count="2">
<span style="height: 18px; padding: 0 6px; border-radius: 3px; background: #2a2a2a; color: #b4b4b4; font-size: 11px; line-height: 18px">{{ tg }}</span>
</sc-for>
</span>
</span>
<span style="font-size: 11px; color: #8c8c8c">{{ p.pos }}</span>
<span role="switch" aria-checked="{{ p.on }}" style="position: relative; flex: none; width: 30px; height: 18px; border-radius: 9px; background: {{ p.trackBg }}"><span style="position: absolute; top: 2px; left: {{ p.knobLeft }}; width: 14px; height: 14px; border-radius: 50%; background: #fff"></span></span>
</li>
</sc-for>
</ul>

<div style="margin: 8px 16px 0; padding-top: 16px; border-top: 1px solid #2b2b2b; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 13px; font-weight: 600">설교 본문 자막</span>
<div style="position: relative; aspect-ratio: 16 / 9; border-radius: 4px; overflow: hidden; background: #0a0a0a; box-shadow: 0 0 0 1px #2b2b2b">
<span style="position: absolute; left: 5%; right: 5%; top: 5%; bottom: 5%; border: 1px dashed #3a3a3a"></span>
<span style="position: absolute; left: 5%; bottom: 9%; display: flex; flex-direction: column; gap: 4px; padding: 10px 16px; border-left: 3px solid #ececec; background: rgba(0, 0, 0, 0.8); box-shadow: 0 0 0 1px #3d8bf0">
<span style="font-size: 20px; line-height: 24px; font-weight: 700; color: #fff">요한복음 3장 16절</span>
<span style="font-size: 12px; color: #c9c9c9">설교 본문</span>
</span>
<span style="position: absolute; left: calc(5% - 4px); bottom: calc(9% - 4px); width: 8px; height: 8px; background: #3d8bf0"></span>
<span style="position: absolute; right: 10px; top: 8px; font-size: 11px; color: #6e6e6e">안전 영역 5%</span>
</div>
<div style="display: flex; gap: 8px">
<span style="display: flex; padding: 2px; border-radius: 5px; background: #121212">
<button type="button" aria-pressed="true" style="height: 26px; padding: 0 10px; border: 0; border-radius: 3px; background: #333333; color: #ececec; font-size: 12px">아래 왼쪽</button>
<button type="button" style="height: 26px; padding: 0 10px; border: 0; border-radius: 3px; background: transparent; color: #8c8c8c; font-size: 12px">아래 가운데</button>
<button type="button" style="height: 26px; padding: 0 10px; border: 0; border-radius: 3px; background: transparent; color: #8c8c8c; font-size: 12px">위 오른쪽</button>
</span>
<span style="margin-left: auto; display: flex; gap: 6px">
<span style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 8px; border-radius: 4px; background: #1f2a3a; box-shadow: inset 0 0 0 1px #3d8bf0; font-size: 12px"><span class="i i14 i-check" style="color: #9cc3f5"></span>방송 자막</span>
<span style="display: inline-flex; align-items: center; height: 30px; padding: 0 10px; border-radius: 4px; box-shadow: inset 0 0 0 1px #3a3a3a; color: #8c8c8c; font-size: 12px">본 화면</span>
</span>
</div>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
const prop = (name, kind, targets, pos, on, selected) => ({
name: name, targets: targets, pos: pos, on: on ? 'true' : 'false',
isLogo: kind === 'logo', isLower: kind === 'lower', isTimer: kind === 'timer', isQr: kind === 'qr',
trackBg: on ? '#3d8bf0' : '#3a3a3a', knobLeft: on ? '14px' : '2px',
bg: selected ? '#232323' : 'transparent'
});
const notice = (n, title, src, sec, current) => ({ n: n, title: title, src: src, sec: sec, ring: current ? '#d2343a' : 'transparent' });
return {
props: [
prop('로고', 'logo', ['본 화면'], '위 오른쪽', true, false),
prop('설교 본문 자막', 'lower', ['방송 자막'], '아래 왼쪽', false, true),
prop('예배 시작 카운트다운', 'timer', ['본 화면', '로비'], '가운데', false, false),
prop('온라인 헌금 안내', 'qr', ['로비'], '아래 오른쪽', false, false)
],
notices: [
notice(1, '주일 예배 안내', '/_blob/a26fea38dfbc6c6a6ebbe467c651a3bf', '8초', false),
notice(2, '수요 기도회', '/_blob/85c85c8365a93673f8757a855a5ae71e', '8초', false),
notice(3, '새가족 환영회', '/_blob/d1b8a9aff7ace0602402185e984ac8c7', '8초', true),
notice(4, '청년부 수련회', '/_blob/2d2d8c67d2ffaa44a487a3a2155fce60', '8초', false),
notice(5, '주차 안내', '/_blob/e03760b0e6da8968216000a548f05339', '8초', false),
notice(6, '온라인 예배', '/_blob/18a41d6fa76a5bf859efd17846f95d68', '8초', false)
]
};
}
}
</script>
</body>
</html>
