<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
const scr = (name, kind, target, state, sel) => ({
name: name, target: target, state: state,
isMain: kind === 'main', isStage: kind === 'stage', isCapture: kind === 'capture', isLobby: kind === 'lobby',
dot: state === '정상' ? '#3dbb6b' : '#e3a23b',
bg: sel ? '#1f4170' : 'transparent'
});
const look = (name, key, active) => ({ name: name, key: key, bg: active ? '#262626' : 'transparent', fg: active ? '#ececec' : '#b4b4b4', icon: active ? '#ececec' : '#8c8c8c', weight: active ? 600 : 500 });
const disp = (num, name, screen, res, w, h, kind) => ({
num: num, name: name, screen: screen, res: res, w: w + 'px', h: h + 'px',
bg: kind === 'control' ? '#202020' : (kind === 'sel' ? '#1f2a3a' : '#262626'),
ring: kind === 'sel' ? '#3d8bf0' : '#3a3a3a',
ringW: kind === 'sel' ? '2px' : '1px',
labelFg: kind === 'control' ? '#8c8c8c' : '#ececec'
});
const seg = (labels, active) => labels.map((l, i) => ({ label: l, bg: i === active ? '#333333' : 'transparent', fg: i === active ? '#ececec' : '#8c8c8c' }));
const field = (label, kind, value, options, on) => ({
label: label, isSelect: kind === 'select', isSeg: kind === 'seg', isSwitch: kind === 'switch', value: value, options: options || [],
on: on ? 'true' : 'false', track: on ? '#3d8bf0' : '#3a3a3a', knob: on ? '14px' : '2px'
});
const cells = (arr) => arr.map((on) => ({ on: on, bg: on ? '#3d8bf0' : 'transparent', line: on ? '#3d8bf0' : '#4a4a4a' }));
const row = (name, kind, arr) => ({ name: name, isMedia: kind === 'media', isCam: kind === 'cam', isText: kind === 'text', isNotice: kind === 'notice', isProp: kind === 'prop', isMsg: kind === 'msg', isSheet: kind === 'sheet', cells: cells(arr) });
return {
screens: [
scr('본 화면', 'main', '모니터 2', '정상', true),
scr('무대 화면', 'stage', '모니터 3', '정상', false),
scr('방송 자막', 'capture', '캡처용 창', '정상', false),
scr('로비', 'lobby', '모니터 4', '주의', false)
],
looks: [
look('평상시', 'Ctrl 1', true),
look('설교', 'Ctrl 2', false),
look('광고', 'Ctrl 3', false),
look('영상만', 'Ctrl 4', false)
],
displays: [
disp(1, '주 모니터', '컨트롤', '2560×1440', 200, 112, 'control'),
disp(2, 'EPSON 프로젝터', '본 화면', '1920×1080  60Hz', 200, 112, 'sel'),
disp(3, '무대 모니터', '무대 화면', '1920×1080  60Hz', 160, 90, 'normal'),
disp(4, '로비 TV', '로비', '1920×1080  30Hz', 160, 90, 'normal')
],
fields: [
field('출력 장치', 'select', 'EPSON 프로젝터'),
field('방식', 'seg', '', seg(['전체 화면', '창', '캡처용 창'], 0)),
field('해상도', 'select', '1920×1080'),
field('연결 끊김 시', 'select', '창으로 전환'),
field('항상 위', 'switch', '', [], true),
field('하드웨어 가속', 'switch', '', [], true)
],
matrix: [
row('배경 미디어', 'media', [true, false, false, false]),
row('카메라', 'cam', [false, false, false, false]),
row('가사', 'text', [true, true, true, false]),
row('공지', 'notice', [false, false, false, true]),
row('소품', 'prop', [true, false, true, false]),
row('메시지', 'msg', [true, true, false, true])
]
};
}
}
</script>
