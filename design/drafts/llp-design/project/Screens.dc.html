<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
const header = (label) => ({ isHeader: true, isItem: false, label: label });
const scr = (name, kind, target, sel) => ({
isHeader: false, isItem: true, name: name, target: target,
isMain: kind === 'main', isStage: kind === 'stage', isCapture: kind === 'capture',
bg: sel ? '#1f4170' : 'transparent', iconColor: sel ? '#ececec' : '#b4b4b4', subColor: sel ? '#b4c6e0' : '#8c8c8c'
});
const look = (name, inUse) => ({ name: name, inUse: inUse, bg: 'transparent', iconColor: '#8c8c8c', chipBg: '#2a2a2a' });
const disp = (num, name, screen, res, w, h, state) => ({
num: num, name: name, screen: screen, res: res, w: w + 'px', h: h + 'px',
bg: state === 'sel' ? '#1d2b3e' : (state === 'control' ? '#1f1f1f' : '#262626'),
ring: state === 'sel' ? '#3d8bf0' : '#3a3a3a', ringW: state === 'sel' ? '2px' : '1px',
numColor: state === 'sel' ? 'rgba(127, 176, 240, 0.55)' : 'rgba(255, 255, 255, 0.16)',
labelColor: state === 'control' ? '#8c8c8c' : '#ececec'
});
const seg = (labels, active) => labels.map((l, i) => ({ label: l, bg: i === active ? '#333333' : 'transparent', fg: i === active ? '#ececec' : '#8c8c8c' }));
const row = (label, kind, value, extra) => Object.assign({
label: label, value: value || '', note: '',
isInput: kind === 'input', isSelect: kind === 'select', isSeg: kind === 'seg', isSwitch: kind === 'switch', isStepper: kind === 'stepper', isText: kind === 'text'
}, extra || {});
const sw = (on) => ({ checked: on ? 'true' : 'false', track: on ? '#2a70dc' : '#3a3a3a', knob: on ? '14px' : '2px' });
return {
screens: [
header('청중'),
scr('본 화면', 'main', '모니터 2', true),
scr('방송 자막', 'capture', 'NDI', false),
header('무대'),
scr('무대 화면', 'stage', '모니터 3', false)
],
looks: [look('평상시', true), look('설교', false), look('광고', false), look('영상만', false)],
displays: [
disp(1, 'DELL U2723QE', '컨트롤', '2560×1440', 205, 115, 'control'),
disp(2, 'EPSON 프로젝터', '본 화면', '1920×1080', 154, 87, 'sel'),
disp(3, '무대 모니터', '무대 화면', '1920×1080', 154, 87, 'normal')
],
bars: ['#c0c0c0', '#c0c000', '#00c0c0', '#00c000', '#c000c0', '#c00000', '#0000c0'],
ramp: ['#000000', '#242424', '#494949', '#6d6d6d', '#929292', '#b6b6b6', '#dbdbdb', '#ffffff'],
groups: [
{ title: '화면', rows: [
row('이름', 'input', '본 화면'),
row('종류', 'seg', '', { options: seg(['청중', '무대'], 0) })
] },
{ title: '출력', rows: [
row('방식', 'seg', '', { options: seg(['전체 화면', '창', '캡처용 창', 'NDI'], 0) }),
row('장치', 'select', '모니터 2', { note: 'EPSON 프로젝터' }),
row('해상도', 'select', '1920×1080'),
row('주사율', 'text', '60Hz')
] },
{ title: '안정성', rows: [
row('연결이 끊기면', 'select', '창으로 바꾸기'),
row('항상 위', 'switch', '', sw(true)),
row('절전 막기', 'switch', '', sw(true))
] },
{ title: '보정', rows: [
row('가장자리 여백', 'stepper', '0%'),
row('위치 미세 조정', 'stepper', '0, 0')
] }
]
};
}
}
